<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #313338; margin: 0; color: #dbdee1; overflow: hidden; }
        .scale-in { animation: scaleIn 0.2s ease-out; }
        @keyframes scaleIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #2b2d31; }
        ::-webkit-scrollbar-thumb { background: #1e1f22; border-radius: 4px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, onSnapshot, serverTimestamp, orderBy } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const { useState, useEffect, useRef } = React;

        // Firebase Configuration
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-chat-app';

        const App = () => {
            const [user, setUser] = useState(null);
            const [username, setUsername] = useState(localStorage.getItem('chat-username') || '');
            const [isUsernameSet, setIsUsernameSet] = useState(!!localStorage.getItem('chat-username'));
            const [messages, setMessages] = useState([]);
            const [inputText, setInputText] = useState('');
            const [isConnecting, setIsConnecting] = useState(true);

            // Handle Authentication
            useEffect(() => {
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch (err) {
                        console.error("Auth error:", err);
                    }
                };
                initAuth();
                const unsubscribe = onAuthStateChanged(auth, (currentUser) => {
                    setUser(currentUser);
                    setIsConnecting(false);
                });
                return () => unsubscribe();
            }, []);

            // Handle Real-time Messages
            useEffect(() => {
                if (!user) return;

                // Path for public global chat
                const messagesCol = collection(db, 'artifacts', appId, 'public', 'data', 'messages');
                
                // Set up listener
                const unsubscribe = onSnapshot(
                    messagesCol, 
                    (snapshot) => {
                        const newMessages = snapshot.docs.map(doc => ({
                            id: doc.id,
                            ...doc.data()
                        }));
                        // Sort manually in memory (Rule 2: No complex queries/orderBy)
                        const sorted = newMessages.sort((a, b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0));
                        setMessages(sorted);
                    },
                    (error) => console.error("Firestore error:", error)
                );

                return () => unsubscribe();
            }, [user]);

            const saveUsername = () => {
                if (username.trim()) {
                    localStorage.setItem('chat-username', username.trim());
                    setIsUsernameSet(true);
                }
            };

            const sendMessage = async () => {
                if (!inputText.trim() || !user) return;
                
                const text = inputText.trim();
                setInputText('');

                try {
                    const messagesCol = collection(db, 'artifacts', appId, 'public', 'data', 'messages');
                    await addDoc(messagesCol, {
                        user: username,
                        userId: user.uid,
                        content: text,
                        timestamp: serverTimestamp()
                    });
                } catch (err) {
                    console.error("Error sending message:", err);
                }
            };

            if (isConnecting) {
                return (
                    <div className="flex h-screen w-full items-center justify-center bg-[#1e1f22] text-[#dbdee1]">
                        <div className="text-center">
                            <i data-lucide="loader-2" className="w-8 h-8 animate-spin mx-auto mb-4 text-[#5865f2]"></i>
                            <p className="text-sm font-medium">Connecting to Cloud Server...</p>
                        </div>
                    </div>
                );
            }

            if (!isUsernameSet) {
                return (
                    <div className="flex h-screen w-full items-center justify-center bg-[#1e1f22]">
                        <div className="bg-[#313338] p-8 rounded-lg shadow-xl w-80 text-center scale-in border border-white/5">
                            <div className="w-16 h-16 bg-[#5865f2] rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg">
                                <i data-lucide="message-square" className="w-8 h-8 text-white"></i>
                            </div>
                            <h2 className="text-xl font-bold mb-2 text-white">Welcome</h2>
                            <p className="text-xs text-[#949ba4] mb-6">Enter a display name to join the global chat.</p>
                            <input 
                                value={username} 
                                onChange={e => setUsername(e.target.value)} 
                                onKeyDown={e => e.key === 'Enter' && saveUsername()} 
                                placeholder="Username"
                                className="w-full bg-[#1e1f22] p-2 rounded mb-4 outline-none border border-white/10 text-white focus:border-[#5865f2] transition-colors" 
                            />
                            <button 
                                onClick={saveUsername} 
                                className="w-full bg-[#5865f2] py-2 rounded font-bold hover:bg-[#4752c4] text-white transition-all active:scale-95"
                            >
                                Start Chatting
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="flex h-screen w-full select-none overflow-hidden bg-[#313338]">
                    {/* Servers Sidebar */}
                    <div className="w-[72px] bg-[#1e1f22] flex flex-col items-center py-3 space-y-2 flex-shrink-0">
                        <div className="w-12 h-12 rounded-[16px] bg-[#5865f2] text-white flex items-center justify-center cursor-pointer relative">
                            <i data-lucide="globe" className="w-6 h-6"></i>
                            <div className="absolute -left-3 w-2 h-8 bg-white rounded-r-full" />
                        </div>
                        <div className="w-8 h-[2px] bg-[#35363c] rounded-full mx-auto" />
                        <div className="w-12 h-12 bg-[#313338] rounded-[24px] flex items-center justify-center text-[#23a559] hover:bg-[#23a559] hover:text-white hover:rounded-[16px] transition-all cursor-not-allowed opacity-50">
                            <i data-lucide="plus"></i>
                        </div>
                    </div>

                    {/* Channels Sidebar */}
                    <div className="w-60 bg-[#2b2d31] flex flex-col flex-shrink-0 border-r border-black/20">
                        <div className="h-12 px-4 flex items-center border-b border-[#1e1f22] font-bold text-white truncate shadow-sm">
                            Global Community
                        </div>
                        <div className="flex-1 p-2 space-y-4">
                            <div>
                                <div className="text-[11px] uppercase font-bold text-[#949ba4] px-2 mb-2 tracking-wider">Text Channels</div>
                                <div className="bg-[#3f4147] text-white flex items-center px-2 py-1.5 rounded-md">
                                    <i data-lucide="hash" className="w-4 h-4 mr-2 opacity-50"></i>
                                    <span className="font-medium text-sm">general-chat</span>
                                </div>
                            </div>
                        </div>
                        
                        {/* User Profile Area */}
                        <div className="bg-[#232428] p-2 flex items-center space-x-2">
                            <div className="w-8 h-8 bg-[#5865f2] rounded-full flex items-center justify-center font-bold text-xs text-white uppercase">{username[0]}</div>
                            <div className="flex-1 min-w-0">
                                <div className="text-white text-xs font-bold truncate">{username}</div>
                                <div className="text-[10px] uppercase font-bold text-[#23a559]">Online</div>
                            </div>
                            <div onClick={() => { localStorage.removeItem('chat-username'); window.location.reload(); }} className="p-1 hover:bg-white/10 rounded cursor-pointer transition-colors group">
                                <i data-lucide="log-out" className="w-4 h-4 text-[#b5bac1] group-hover:text-red-400"></i>
                            </div>
                        </div>
                    </div>

                    {/* Chat Main Area */}
                    <div className="flex-1 flex flex-col min-w-0">
                        <div className="h-12 border-b border-black/20 flex items-center px-4 shadow-sm bg-[#313338] z-10">
                            <i data-lucide="hash" className="w-5 h-5 text-[#80848e] mr-2"></i>
                            <span className="font-bold text-white text-sm">general-chat</span>
                            <div className="ml-2 w-2 h-2 rounded-full bg-[#23a559]"></div>
                        </div>
                        
                        <div className="flex-1 overflow-y-auto p-4 flex flex-col-reverse space-y-4">
                            {messages.map(m => (
                                <div key={m.id} className="flex items-start space-x-3 p-1 rounded hover:bg-black/5 group transition-colors">
                                    <div className="w-10 h-10 bg-[#5865f2] rounded-full flex-shrink-0 flex items-center justify-center font-bold text-white uppercase shadow-sm">
                                        {m.user ? m.user[0] : '?'}
                                    </div>
                                    <div className="min-w-0 flex-1">
                                        <div className="flex items-baseline space-x-2">
                                            <span className="font-bold text-white text-sm hover:underline cursor-pointer">{m.user}</span>
                                            <span className="text-[10px] text-[#949ba4]">
                                                {m.timestamp?.seconds ? new Date(m.timestamp.seconds * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : 'Sending...'}
                                            </span>
                                        </div>
                                        <p className="text-sm text-[#dbdee1] break-words whitespace-pre-wrap">{m.content}</p>
                                    </div>
                                </div>
                            ))}
                            
                            {/* Welcome Message */}
                            <div className="py-8 text-center border-b border-white/5 mb-4">
                                <div className="w-16 h-16 bg-[#3f4147] rounded-full flex items-center justify-center mx-auto mb-4 text-[#dbdee1]">
                                    <i data-lucide="hash" className="w-8 h-8"></i>
                                </div>
                                <h3 className="text-2xl font-bold text-white mb-1">Welcome to #general-chat!</h3>
                                <p className="text-[#949ba4] text-sm">This is the start of the global conversation.</p>
                            </div>
                        </div>

                        {/* Input Area */}
                        <div className="p-4">
                            <div className="bg-[#383a40] rounded-lg px-4 py-2.5 flex items-center shadow-inner group focus-within:ring-1 ring-[#5865f2]/50 transition-all">
                                <div className="w-6 h-6 bg-[#b5bac1] rounded-full flex items-center justify-center mr-3 cursor-pointer hover:bg-white transition-colors">
                                    <i data-lucide="plus" className="w-4 h-4 text-[#383a40]"></i>
                                </div>
                                <input 
                                    className="flex-1 bg-transparent outline-none text-sm text-[#dbdee1] placeholder-[#949ba4]" 
                                    placeholder={`Message #general-chat`} 
                                    value={inputText} 
                                    onChange={e => setInputText(e.target.value)} 
                                    onKeyDown={e => e.key === 'Enter' && sendMessage()} 
                                />
                                <div className="flex space-x-3 ml-2 text-[#b5bac1]">
                                    <i data-lucide="gift" className="w-5 h-5 cursor-not-allowed hover:text-white"></i>
                                    <i data-lucide="sticky-note" className="w-5 h-5 cursor-not-allowed hover:text-white"></i>
                                    <i data-lucide="smile" className="w-5 h-5 cursor-not-allowed hover:text-white"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
        setInterval(() => window.lucide && window.lucide.createIcons(), 1000);
    </script>
</body>
</html>
