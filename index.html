<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cloud Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #313338; 
            margin: 0; 
            color: #dbdee1; 
            overflow: hidden;
            touch-action: manipulation;
        }
        .scale-in { animation: scaleIn 0.2s ease-out; }
        @keyframes scaleIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        
        /* Mobile Drawer Animation */
        .drawer-transition { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #1e1f22; border-radius: 4px; }
        
        /* Fix for mobile keyboard pushing content */
        .chat-container { height: 100dvh; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB-dwq2yjLEUSNZ0UT5oq4-u_KXghysXfw",
            authDomain: "discord2-1ed09.firebaseapp.com",
            projectId: "discord2-1ed09",
            storageBucket: "discord2-1ed09.firebasestorage.app",
            messagingSenderId: "856172729472",
            appId: "1:856172729472:web:fa00078f5968d3e30a0265",
            measurementId: "G-XLL488F4K0"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.FirebaseSDK = { 
            auth, 
            db, 
            appId: "discord-clone-v2",
            collection, 
            addDoc, 
            onSnapshot, 
            serverTimestamp, 
            signInAnonymously, 
            onAuthStateChanged 
        };
        window.dispatchEvent(new Event('firebase-ready'));
    </script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const App = () => {
            const [fb, setFb] = useState(window.FirebaseSDK);
            const [user, setUser] = useState(null);
            const [username, setUsername] = useState(localStorage.getItem('chat-username') || '');
            const [isUsernameSet, setIsUsernameSet] = useState(!!localStorage.getItem('chat-username'));
            const [messages, setMessages] = useState([]);
            const [inputText, setInputText] = useState('');
            const [status, setStatus] = useState('Connecting...');
            const [isDrawerOpen, setIsDrawerOpen] = useState(false);
            const scrollRef = useRef(null);

            useEffect(() => {
                const handleReady = () => setFb(window.FirebaseSDK);
                if (!fb) window.addEventListener('firebase-ready', handleReady);
                return () => window.removeEventListener('firebase-ready', handleReady);
            }, [fb]);

            useEffect(() => {
                if (!fb) return;
                fb.signInAnonymously(fb.auth).catch(() => setStatus('Auth Failed'));
                return fb.onAuthStateChanged(fb.auth, (u) => {
                    setUser(u);
                    if (u) setStatus('Connected');
                });
            }, [fb]);

            useEffect(() => {
                if (!user || !fb) return;
                const col = fb.collection(fb.db, 'artifacts', fb.appId, 'public', 'data', 'messages');
                return fb.onSnapshot(col, (snap) => {
                    const msgs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    setMessages(msgs.sort((a, b) => (a.timestamp?.seconds || 0) - (b.timestamp?.seconds || 0)));
                });
            }, [user, fb]);

            // Auto-scroll to bottom
            useEffect(() => {
                if (scrollRef.current) {
                    scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
                }
            }, [messages]);

            const saveUsername = () => {
                if (username.trim()) {
                    localStorage.setItem('chat-username', username.trim());
                    setIsUsernameSet(true);
                }
            };

            const sendMessage = async () => {
                if (!inputText.trim() || !user || !fb) return;
                const text = inputText.trim();
                setInputText('');
                try {
                    const col = fb.collection(fb.db, 'artifacts', fb.appId, 'public', 'data', 'messages');
                    await fb.addDoc(col, {
                        user: username,
                        userId: user.uid,
                        content: text,
                        timestamp: fb.serverTimestamp()
                    });
                } catch (err) { console.error(err); }
            };

            if (!user) return (
                <div className="flex h-screen w-full items-center justify-center bg-[#1e1f22]">
                    <div className="text-center">
                        <div className="w-12 h-12 border-4 border-[#5865f2] border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
                        <p className="text-sm font-medium">{status}</p>
                    </div>
                </div>
            );

            if (!isUsernameSet) return (
                <div className="flex h-screen w-full items-center justify-center bg-[#1e1f22] p-6">
                    <div className="bg-[#313338] p-6 rounded-2xl shadow-xl w-full max-w-sm text-center scale-in border border-white/5">
                        <div className="w-16 h-16 bg-[#5865f2] rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg">
                            <i data-lucide="smile" className="w-8 h-8 text-white"></i>
                        </div>
                        <h2 className="text-xl font-bold mb-2 text-white">Choose a Name</h2>
                        <p className="text-xs text-[#949ba4] mb-6">Pick a nickname to start chatting.</p>
                        <input 
                            value={username} 
                            onChange={e => setUsername(e.target.value)} 
                            onKeyDown={e => e.key === 'Enter' && saveUsername()} 
                            placeholder="Your nickname..."
                            className="w-full bg-[#1e1f22] p-3 rounded-xl mb-4 outline-none border border-white/10 text-white focus:border-[#5865f2] text-center" 
                        />
                        <button onClick={saveUsername} className="w-full bg-[#5865f2] py-3 rounded-xl font-bold text-white active:scale-95 transition-transform">Join Chat</button>
                    </div>
                </div>
            );

            return (
                <div className="flex chat-container w-full bg-[#313338] text-[#dbdee1] overflow-hidden relative">
                    
                    {/* Mobile Backdrop */}
                    {isDrawerOpen && (
                        <div 
                            className="fixed inset-0 bg-black/60 z-40 lg:hidden"
                            onClick={() => setIsDrawerOpen(false)}
                        ></div>
                    )}

                    {/* Left Sidebar (Drawer on Mobile) */}
                    <div className={`
                        fixed inset-y-0 left-0 z-50 w-72 bg-[#2b2d31] flex drawer-transition transform
                        lg:relative lg:translate-x-0 lg:z-0
                        ${isDrawerOpen ? 'translate-x-0 shadow-2xl' : '-translate-x-full'}
                    `}>
                        {/* Server Icons (Slim bar) */}
                        <div className="w-[72px] bg-[#1e1f22] flex flex-col items-center py-3 space-y-3 flex-shrink-0">
                            <div className="w-12 h-12 rounded-[16px] bg-[#5865f2] text-white flex items-center justify-center shadow-lg">
                                <i data-lucide="message-circle" className="w-6 h-6"></i>
                            </div>
                            <div className="w-8 h-[2px] bg-white/5 rounded-full"></div>
                            <div className="w-12 h-12 rounded-full bg-[#313338] text-[#23a559] flex items-center justify-center hover:bg-[#23a559] hover:text-white transition-all cursor-pointer">
                                <i data-lucide="plus" className="w-6 h-6"></i>
                            </div>
                        </div>

                        {/* Channel List */}
                        <div className="flex-1 flex flex-col min-w-0">
                            <div className="h-12 px-4 flex items-center border-b border-[#1e1f22] font-bold text-white shadow-sm">
                                Public Server
                            </div>
                            <div className="flex-1 p-3 space-y-1">
                                <div className="text-[12px] uppercase font-bold text-[#949ba4] px-2 mb-2">Text Channels</div>
                                <div className="bg-[#3f4147] text-white flex items-center px-3 py-2 rounded-md">
                                    <i data-lucide="hash" className="w-4 h-4 mr-2 opacity-50"></i>
                                    <span className="font-medium text-sm">general</span>
                                </div>
                            </div>
                            {/* User Profile Area */}
                            <div className="bg-[#232428] p-3 flex items-center space-x-3">
                                <div className="w-8 h-8 bg-[#5865f2] rounded-full flex items-center justify-center font-bold text-xs uppercase shadow-md">{username[0]}</div>
                                <div className="flex-1 min-w-0">
                                    <div className="text-white text-xs font-bold truncate">{username}</div>
                                    <div className="text-[10px] text-[#23a559] font-bold">Online</div>
                                </div>
                                <button onClick={() => { localStorage.clear(); window.location.reload(); }} className="p-2 hover:bg-white/5 rounded-lg transition-colors">
                                    <i data-lucide="log-out" className="w-4 h-4 text-[#b5bac1]"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    {/* Main Chat Area */}
                    <div className="flex-1 flex flex-col min-w-0 bg-[#313338] relative">
                        {/* Header */}
                        <div className="h-12 border-b border-[#1e1f22] flex items-center px-4 shadow-sm flex-shrink-0">
                            <button 
                                onClick={() => setIsDrawerOpen(true)}
                                className="mr-3 p-1 lg:hidden hover:bg-white/5 rounded transition-colors"
                            >
                                <i data-lucide="menu" className="w-6 h-6"></i>
                            </button>
                            <i data-lucide="hash" className="w-5 h-5 text-[#80848e] mr-2"></i>
                            <span className="font-bold text-white text-sm">general</span>
                        </div>
                        
                        {/* Messages List */}
                        <div ref={scrollRef} className="flex-1 overflow-y-auto p-4 space-y-4">
                            {messages.length === 0 && (
                                <div className="h-full flex flex-col items-center justify-center text-center opacity-40 px-6">
                                    <i data-lucide="message-square" className="w-12 h-12 mb-4"></i>
                                    <p className="text-sm font-medium">Welcome to the beginning of the #general channel.</p>
                                </div>
                            )}
                            {messages.map(m => (
                                <div key={m.id} className="flex items-start space-x-3 group">
                                    <div className="w-10 h-10 bg-[#5865f2] rounded-full flex-shrink-0 flex items-center justify-center font-bold text-white uppercase text-sm shadow-sm">{m.user ? m.user[0] : '?'}</div>
                                    <div className="min-w-0">
                                        <div className="flex items-baseline space-x-2">
                                            <span className="font-bold text-white text-[15px]">{m.user}</span>
                                            <span className="text-[10px] text-[#949ba4]">
                                                {m.timestamp?.seconds ? new Date(m.timestamp.seconds * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '...'}
                                            </span>
                                        </div>
                                        <p className="text-[15px] text-[#dbdee1] break-words leading-snug">{m.content}</p>
                                    </div>
                                </div>
                            ))}
                        </div>

                        {/* Input Area */}
                        <div className="px-4 pb-6 lg:pb-8 pt-2">
                            <div className="bg-[#383a40] rounded-xl px-4 py-1 flex items-center shadow-lg border border-white/5 min-h-[44px]">
                                <button className="p-2 mr-1 text-[#b5bac1] hover:text-white transition-colors">
                                    <i data-lucide="plus-circle" className="w-6 h-6"></i>
                                </button>
                                <input 
                                    className="flex-1 bg-transparent outline-none text-[15px] text-[#dbdee1] placeholder-[#949ba4] py-2" 
                                    placeholder="Message #general" 
                                    value={inputText} 
                                    maxLength={500}
                                    onChange={e => setInputText(e.target.value)} 
                                    onKeyDown={e => e.key === 'Enter' && sendMessage()} 
                                />
                                <button 
                                    onClick={sendMessage}
                                    className={`p-2 ml-2 transition-all ${inputText.trim() ? 'text-[#5865f2] scale-110' : 'text-[#b5bac1] opacity-50'}`}
                                >
                                    <i data-lucide="send" className="w-5 h-5"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
        setInterval(() => window.lucide && window.lucide.createIcons(), 500);
    </script>
</body>
</html>
