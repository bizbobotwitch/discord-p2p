<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cloud Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #313338; 
            margin: 0; 
            color: #dbdee1; 
            overflow: hidden;
            touch-action: manipulation;
        }
        .scale-in { animation: scaleIn 0.2s ease-out; }
        @keyframes scaleIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        
        .drawer-transition { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #1e1f22; border-radius: 4px; }
        
        .chat-container { height: 100dvh; }

        .voice-active-ring {
            box-shadow: 0 0 0 2px #23a559;
            animation: pulse-green 2s infinite;
        }
        @keyframes pulse-green {
            0% { box-shadow: 0 0 0 0 rgba(35, 165, 89, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(35, 165, 89, 0); }
            100% { box-shadow: 0 0 0 0 rgba(35, 165, 89, 0); }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp, doc, setDoc, deleteDoc, query, where, getDocs, limit } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.FirebaseSDK = { 
            auth, db, 
            appId: typeof __app_id !== 'undefined' ? __app_id : 'discord-clone-v2',
            initialToken: typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null,
            collection, addDoc, onSnapshot, serverTimestamp, 
            signInAnonymously, signInWithCustomToken, onAuthStateChanged, doc, setDoc, deleteDoc, query, where, getDocs, limit
        };
        window.dispatchEvent(new Event('firebase-ready'));
    </script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const App = () => {
            const [fb, setFb] = useState(window.FirebaseSDK);
            const [user, setUser] = useState(null);
            const [username, setUsername] = useState(localStorage.getItem('chat-username') || '');
            const [currentServerId, setCurrentServerId] = useState(localStorage.getItem('chat-server-id') || 'general-server');
            const [myServers, setMyServers] = useState(JSON.parse(localStorage.getItem('my-servers') || '["general-server"]'));
            const [isUsernameSet, setIsUsernameSet] = useState(!!localStorage.getItem('chat-username'));
            
            const [messages, setMessages] = useState([]);
            const [inputText, setInputText] = useState('');
            const [status, setStatus] = useState('Connecting...');
            const [isDrawerOpen, setIsDrawerOpen] = useState(false);
            const [showServerModal, setShowServerModal] = useState(false);
            const [newServerInput, setNewServerInput] = useState('');
            
            const [isVoiceConnected, setIsVoiceConnected] = useState(false);
            const [voiceParticipants, setVoiceParticipants] = useState([]);
            const [isMuted, setIsMuted] = useState(false);
            const [showCallScreen, setShowCallScreen] = useState(false);
            const localStream = useRef(null);
            const scrollRef = useRef(null);

            // 1. Initial Auth Logic (MANDATORY RULE 3)
            useEffect(() => {
                const handleReady = () => setFb(window.FirebaseSDK);
                if (!fb) {
                    window.addEventListener('firebase-ready', handleReady);
                    return () => window.removeEventListener('firebase-ready', handleReady);
                }

                const initAuth = async () => {
                    try {
                        if (fb.initialToken) {
                            await fb.signInWithCustomToken(fb.auth, fb.initialToken);
                        } else {
                            await fb.signInAnonymously(fb.auth);
                        }
                    } catch (err) {
                        console.error("Auth error:", err);
                        setStatus('Auth Failed');
                    }
                };

                initAuth();
                const unsubscribe = fb.onAuthStateChanged(fb.auth, (u) => {
                    setUser(u);
                    if (u) setStatus('Connected');
                });
                return () => unsubscribe();
            }, [fb]);

            // 2. Fetch Messages (Guarded by user and Strict Paths - MANDATORY RULE 1 & 3)
            useEffect(() => {
                if (!user || !fb || !currentServerId) return;
                
                // Using a flat structure within the allowed public path
                // Paths MUST be: /artifacts/{appId}/public/data/{collectionName}
                const collectionName = `messages_${currentServerId}`;
                const col = fb.collection(fb.db, 'artifacts', fb.appId, 'public', 'data', collectionName);
                
                const unsubscribe = fb.onSnapshot(col, 
                    (snap) => {
                        const msgs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                        // Sort in memory (MANDATORY RULE 2)
                        setMessages(msgs.sort((a, b) => (a.timestamp?.seconds || 0) - (b.timestamp?.seconds || 0)));
                    },
                    (error) => console.error("Snapshot error:", error)
                );
                return () => unsubscribe();
            }, [user, fb, currentServerId]);

            // 3. Fetch Voice Participants (MANDATORY RULE 1 & 3)
            useEffect(() => {
                if (!user || !fb || !currentServerId) return;
                const collectionName = `voice_${currentServerId}`;
                const col = fb.collection(fb.db, 'artifacts', fb.appId, 'public', 'data', collectionName);
                
                const unsubscribe = fb.onSnapshot(col, 
                    (snap) => {
                        setVoiceParticipants(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                    },
                    (error) => console.error("Voice snapshot error:", error)
                );
                return () => unsubscribe();
            }, [user, fb, currentServerId]);

            useEffect(() => {
                if (scrollRef.current) {
                    scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
                }
            }, [messages]);

            const saveUsername = () => {
                if (username.trim()) {
                    localStorage.setItem('chat-username', username.trim());
                    setIsUsernameSet(true);
                }
            };

            const joinServer = async (id) => {
                const cleanId = id.trim().toLowerCase().replace(/\s+/g, '-');
                if (!cleanId || !fb || !user) return;
                if (isVoiceConnected) toggleVoice();
                setCurrentServerId(cleanId);
                localStorage.setItem('chat-server-id', cleanId);
                if (!myServers.includes(cleanId)) {
                    const newList = [cleanId, ...myServers].slice(0, 10);
                    setMyServers(newList);
                    localStorage.setItem('my-servers', JSON.stringify(newList));
                }
                setShowServerModal(false);
                setNewServerInput('');
                setIsDrawerOpen(false);
            };

            const sendMessage = async () => {
                if (!inputText.trim() || !user || !fb) return;
                const text = inputText.trim();
                setInputText('');
                
                try {
                    const collectionName = `messages_${currentServerId}`;
                    const col = fb.collection(fb.db, 'artifacts', fb.appId, 'public', 'data', collectionName);
                    await fb.addDoc(col, {
                        user: username,
                        userId: user.uid,
                        content: text,
                        timestamp: fb.serverTimestamp()
                    });
                } catch (err) {
                    console.error("Send error:", err);
                }
            };

            const toggleVoice = async () => {
                if (!user || !fb) return;
                const collectionName = `voice_${currentServerId}`;
                const voiceDoc = fb.doc(fb.db, 'artifacts', fb.appId, 'public', 'data', collectionName, user.uid);
                
                if (isVoiceConnected) {
                    if (localStream.current) localStream.current.getTracks().forEach(t => t.stop());
                    await fb.deleteDoc(voiceDoc);
                    setIsVoiceConnected(false);
                    setShowCallScreen(false);
                } else {
                    try {
                        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                        localStream.current = stream;
                        await fb.setDoc(voiceDoc, {
                            uid: user.uid, name: username, isMuted: false, joinedAt: Date.now()
                        });
                        setIsVoiceConnected(true);
                        setIsMuted(false);
                        setShowCallScreen(true);
                    } catch (err) { console.error("Voice error:", err); }
                }
            };

            const toggleMute = () => {
                if (localStream.current && user && fb) {
                    const v = !isMuted;
                    localStream.current.getAudioTracks()[0].enabled = !v;
                    setIsMuted(v);
                    const collectionName = `voice_${currentServerId}`;
                    const voiceDoc = fb.doc(fb.db, 'artifacts', fb.appId, 'public', 'data', collectionName, user.uid);
                    fb.setDoc(voiceDoc, { isMuted: v }, { merge: true });
                }
            };

            if (!user) return <div className="flex h-screen items-center justify-center bg-[#1e1f22] text-sm">{status}</div>;

            if (!isUsernameSet) return (
                <div className="flex h-screen items-center justify-center bg-[#1e1f22] p-6">
                    <div className="bg-[#313338] p-8 rounded-2xl w-full max-w-sm border border-white/5 scale-in text-center">
                        <div className="w-16 h-16 bg-[#5865f2] rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg">
                            <i data-lucide="smile" className="text-white w-8 h-8"></i>
                        </div>
                        <h2 className="text-xl font-bold mb-6">Cloud Chat</h2>
                        <input value={username} onChange={e=>setUsername(e.target.value)} placeholder="Nickname" className="w-full bg-[#1e1f22] p-3 rounded-xl mb-4 border border-white/10 outline-none focus:border-[#5865f2] text-center" />
                        <button onClick={saveUsername} className="w-full bg-[#5865f2] py-3 rounded-xl font-bold active:scale-95 transition-transform">Enter</button>
                    </div>
                </div>
            );

            return (
                <div className="flex chat-container w-full bg-[#313338] text-[#dbdee1] overflow-hidden relative">
                    {showCallScreen && (
                        <div className="fixed inset-0 bg-[#1e1f22] z-[60] flex flex-col scale-in">
                            <div className="flex-1 flex flex-wrap items-center justify-center gap-8 p-10 overflow-y-auto">
                                {voiceParticipants.map(p => (
                                    <div key={p.uid} className="flex flex-col items-center">
                                        <div className={`w-32 h-32 rounded-full bg-[#313338] flex items-center justify-center text-4xl font-bold relative ${!p.isMuted ? 'voice-active-ring' : ''}`}>
                                            {p.name?.[0]}
                                            {p.isMuted && <div className="absolute bottom-0 right-0 bg-[#ed4245] p-2 rounded-full border-4 border-[#1e1f22]"><i data-lucide="mic-off" className="w-4 h-4"></i></div>}
                                        </div>
                                        <span className="mt-4 font-bold">{p.name}</span>
                                    </div>
                                ))}
                            </div>
                            <div className="h-24 bg-[#2b2d31] flex items-center justify-center space-x-6 border-t border-white/5">
                                <button onClick={()=>setShowCallScreen(false)} className="p-4 rounded-full bg-[#4e5058]"><i data-lucide="minimize-2"></i></button>
                                <button onClick={toggleMute} className={`p-4 rounded-full ${isMuted ? 'bg-[#ed4245]' : 'bg-[#4e5058]'}`}><i data-lucide={isMuted ? "mic-off" : "mic"}></i></button>
                                <button onClick={toggleVoice} className="p-4 rounded-full bg-[#ed4245]"><i data-lucide="phone-off"></i></button>
                            </div>
                        </div>
                    )}

                    {showServerModal && (
                        <div className="fixed inset-0 bg-black/80 z-[70] flex items-center justify-center p-4">
                            <div className="bg-[#313338] w-full max-w-sm rounded-2xl p-6 border border-white/10 scale-in">
                                <h3 className="text-xl font-bold mb-4">Join Server</h3>
                                <input value={newServerInput} onChange={e=>setNewServerInput(e.target.value)} placeholder="Server ID" className="w-full bg-[#1e1f22] p-3 rounded-xl mb-6 outline-none border border-white/10" />
                                <div className="flex gap-3">
                                    <button onClick={()=>setShowServerModal(false)} className="flex-1 py-3 text-sm">Cancel</button>
                                    <button onClick={()=>joinServer(newServerInput)} className="flex-1 bg-[#23a559] py-3 rounded-xl font-bold">Go</button>
                                </div>
                            </div>
                        </div>
                    )}

                    <div className={`fixed inset-y-0 left-0 z-50 w-72 bg-[#2b2d31] flex drawer-transition transform lg:relative lg:translate-x-0 ${isDrawerOpen ? 'translate-x-0 shadow-2xl' : '-translate-x-full'}`}>
                        <div className="w-[72px] bg-[#1e1f22] flex flex-col items-center py-3 space-y-3 overflow-y-auto no-scrollbar shrink-0">
                            {myServers.map(s => (
                                <div key={s} onClick={()=>joinServer(s)} className={`w-12 h-12 rounded-[24px] flex items-center justify-center cursor-pointer transition-all hover:rounded-[16px] relative ${currentServerId === s ? 'bg-[#5865f2] rounded-[16px]' : 'bg-[#313338]'}`}>
                                    {currentServerId === s && <div className="absolute -left-3 w-2 h-10 bg-white rounded-r-full"></div>}
                                    <span className="font-bold text-xs uppercase">{s.slice(0,2)}</span>
                                </div>
                            ))}
                            <div onClick={()=>setShowServerModal(true)} className="w-12 h-12 rounded-full bg-[#313338] text-[#23a559] flex items-center justify-center cursor-pointer hover:bg-[#23a559] hover:text-white transition-all"><i data-lucide="plus"></i></div>
                        </div>
                        <div className="flex-1 flex flex-col min-w-0">
                            <div className="h-12 px-4 flex items-center border-b border-[#1e1f22] font-bold text-sm truncate">{currentServerId}</div>
                            <div className="flex-1 p-3 space-y-4 overflow-y-auto no-scrollbar">
                                <div>
                                    <div className="text-[10px] uppercase font-bold text-[#949ba4] px-2 mb-2">Text Channels</div>
                                    <div className="bg-[#3f4147] px-3 py-2 rounded text-sm flex items-center gap-2 cursor-pointer"><i data-lucide="hash" className="w-4 h-4 opacity-50"></i> general</div>
                                </div>
                                <div>
                                    <div className="text-[10px] uppercase font-bold text-[#949ba4] px-2 mb-2">Voice Channels</div>
                                    <div onClick={toggleVoice} className={`px-3 py-2 rounded text-sm flex items-center gap-2 cursor-pointer ${isVoiceConnected ? 'bg-[#3f4147] font-bold' : 'hover:bg-[#35373c]'}`}><i data-lucide="volume-2" className="w-4 h-4 opacity-50"></i> General Voice</div>
                                    <div className="mt-2 ml-4 space-y-2">
                                        {voiceParticipants.map(p => (
                                            <div key={p.uid} className="flex items-center gap-2 text-xs">
                                                <div className={`w-5 h-5 rounded-full bg-[#5865f2] flex items-center justify-center text-[8px] font-bold ${!p.isMuted && isVoiceConnected ? 'ring-2 ring-[#23a559]' : ''}`}>{p.name?.[0]}</div>
                                                <span className="truncate flex-1">{p.name}</span>
                                                {p.isMuted && <i data-lucide="mic-off" className="w-3 h-3 text-red-400"></i>}
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                            <div className="bg-[#232428] p-3 flex items-center gap-3 mt-auto">
                                <div className="w-8 h-8 bg-[#5865f2] rounded-full flex items-center justify-center font-bold text-xs uppercase">{username?.[0]}</div>
                                <div className="flex-1 min-w-0 text-[10px]"><div className="font-bold truncate text-white">{username}</div><div>Online</div></div>
                                <button onClick={()=>{localStorage.clear(); location.reload();}} className="p-2 hover:bg-white/5 rounded-lg"><i data-lucide="log-out" className="w-4 h-4 text-[#b5bac1]"></i></button>
                            </div>
                        </div>
                    </div>

                    <div className="flex-1 flex flex-col min-w-0 bg-[#313338]">
                        <div className="h-12 border-b border-[#1e1f22] flex items-center px-4 shadow-sm shrink-0">
                            <button onClick={()=>setIsDrawerOpen(true)} className="mr-3 lg:hidden"><i data-lucide="menu"></i></button>
                            <i data-lucide="hash" className="w-5 h-5 text-[#80848e] mr-2"></i>
                            <span className="font-bold text-sm">general</span>
                            <div className="flex-1"></div>
                            <div className="text-[10px] font-bold text-[#b5bac1] bg-[#1e1f22] px-2 py-1 rounded">ID: {currentServerId}</div>
                        </div>
                        <div ref={scrollRef} className="flex-1 overflow-y-auto p-4 space-y-4 no-scrollbar">
                            {messages.length === 0 ? (
                                <div className="h-full flex flex-col items-center justify-center opacity-20 select-none">
                                    <i data-lucide="message-square" className="w-16 h-16 mb-2"></i>
                                    <p className="text-sm font-medium">No messages yet</p>
                                </div>
                            ) : messages.map(m => (
                                <div key={m.id} className="flex items-start gap-3">
                                    <div className="w-10 h-10 bg-[#5865f2] rounded-full shrink-0 flex items-center justify-center font-bold text-white uppercase">{m.user?.[0]}</div>
                                    <div className="min-w-0 flex-1">
                                        <div className="flex items-baseline gap-2">
                                            <span className="font-bold text-sm text-white">{m.user}</span>
                                            <span className="text-[10px] text-[#949ba4]">{m.timestamp?.seconds ? new Date(m.timestamp.seconds * 1000).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : ''}</span>
                                        </div>
                                        <p className="text-sm break-words">{m.content}</p>
                                    </div>
                                </div>
                            ))}
                        </div>
                        <div className="px-4 pb-6 shrink-0">
                            <div className="bg-[#383a40] rounded-xl px-4 py-2 flex items-center gap-3 shadow-inner">
                                <input className="bg-transparent flex-1 outline-none text-sm" placeholder="Message #general" value={inputText} onChange={e=>setInputText(e.target.value)} onKeyDown={e=>e.key==='Enter' && sendMessage()}/>
                                <button onClick={sendMessage} className={inputText.trim() ? 'text-[#5865f2]' : 'text-[#b5bac1] opacity-50'}><i data-lucide="send" className="w-5 h-5"></i></button>
                            </div>
                        </div>
                    </div>
                    {isDrawerOpen && <div onClick={()=>setIsDrawerOpen(false)} className="fixed inset-0 bg-black/50 z-40 lg:hidden"></div>}
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
        setInterval(() => window.lucide && window.lucide.createIcons(), 500);
    </script>
</body>
</html>
