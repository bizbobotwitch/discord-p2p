<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cloud Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #313338; 
            margin: 0; 
            color: #dbdee1; 
            overflow: hidden;
        }
        .scale-in { animation: scaleIn 0.2s ease-out; }
        @keyframes scaleIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .chat-container { height: 100dvh; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #1e1f22; border-radius: 4px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp, doc, setDoc, deleteDoc, query, where, getDocs, limit, updateDoc, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Global Firebase Config and App ID from environment
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'cloud-chat-v1';

        // Export to window for the React component
        window.FirebaseCore = { 
            auth, db, appId,
            collection, addDoc, onSnapshot, serverTimestamp, 
            signInAnonymously, signInWithCustomToken, onAuthStateChanged, 
            doc, setDoc, deleteDoc, query, where, getDocs, limit,
            updateDoc, arrayUnion, arrayRemove
        };
        window.dispatchEvent(new Event('firebase-ready'));
    </script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const App = () => {
            const [user, setUser] = useState(null);
            const [status, setStatus] = useState('Initializing...');
            const [username, setUsername] = useState(localStorage.getItem('chat-username') || '');
            const [isUsernameSet, setIsUsernameSet] = useState(!!localStorage.getItem('chat-username'));
            const [currentServerId, setCurrentServerId] = useState(localStorage.getItem('chat-server-id') || 'general-lobby');
            const [messages, setMessages] = useState([]);
            const [inputText, setInputText] = useState('');
            const [isDrawerOpen, setIsDrawerOpen] = useState(false);
            
            // Firebase Reference
            const fb = window.FirebaseCore;
            const scrollRef = useRef(null);

            // 1. Handle Authentication (Mandatory Rule 3)
            useEffect(() => {
                if (!fb) return;

                const performAuth = async () => {
                    try {
                        setStatus('Authenticating...');
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await fb.signInWithCustomToken(fb.auth, __initial_auth_token);
                        } else {
                            await fb.signInAnonymously(fb.auth);
                        }
                    } catch (err) {
                        console.error("Auth Error:", err);
                        setStatus('Authentication Failed');
                    }
                };

                performAuth();

                const unsubscribe = fb.onAuthStateChanged(fb.auth, (u) => {
                    if (u) {
                        setUser(u);
                        setStatus('Connected');
                        // Update presence
                        fb.setDoc(fb.doc(fb.db, 'artifacts', fb.appId, 'public', 'data', 'userPresence', u.uid), {
                            username: username || 'Guest',
                            lastSeen: fb.serverTimestamp()
                        }, { merge: true });
                    }
                });

                return () => unsubscribe();
            }, []);

            // 2. Listen for Messages (Mandatory Rule 1 & 2)
            useEffect(() => {
                if (!user || !fb) return;

                // Path must be /artifacts/{appId}/public/data/{collection}
                const msgCol = fb.collection(fb.db, 'artifacts', fb.appId, 'public', 'data', `messages_${currentServerId}`);
                
                const unsubscribe = fb.onSnapshot(msgCol, (snap) => {
                    const msgs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    // Sort in memory (Mandatory Rule 2)
                    setMessages(msgs.sort((a, b) => (a.timestamp?.seconds || 0) - (b.timestamp?.seconds || 0)));
                }, (err) => {
                    console.error("Message Listen Error:", err);
                });

                return () => unsubscribe();
            }, [user, currentServerId]);

            useEffect(() => {
                if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
            }, [messages]);

            const handleSend = async () => {
                if (!inputText.trim() || !user || !fb) return;
                const text = inputText.trim();
                setInputText('');

                try {
                    const msgCol = fb.collection(fb.db, 'artifacts', fb.appId, 'public', 'data', `messages_${currentServerId}`);
                    await fb.addDoc(msgCol, {
                        user: username,
                        userId: user.uid,
                        content: text,
                        timestamp: fb.serverTimestamp()
                    });
                } catch (e) {
                    console.error("Send Error:", e);
                }
            };

            const saveUsername = () => {
                if (username.trim()) {
                    localStorage.setItem('chat-username', username.trim());
                    setIsUsernameSet(true);
                }
            };

            // Loading State
            if (!user) {
                return (
                    <div className="flex h-screen items-center justify-center bg-[#1e1f22] text-[#949ba4]">
                        <div className="text-center">
                            <div className="w-8 h-8 border-4 border-[#5865f2] border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
                            <p className="text-sm font-medium uppercase tracking-widest">{status}</p>
                        </div>
                    </div>
                );
            }

            // Nickname Setup
            if (!isUsernameSet) {
                return (
                    <div className="flex h-screen items-center justify-center bg-[#1e1f22] p-6">
                        <div className="bg-[#313338] p-8 rounded-2xl shadow-xl w-full max-w-sm border border-white/5 scale-in">
                            <h2 className="text-xl font-bold mb-6 text-white text-center">Set Your Nickname</h2>
                            <input 
                                value={username} 
                                onChange={e => setUsername(e.target.value)} 
                                placeholder="Enter a name..." 
                                className="w-full bg-[#1e1f22] p-4 rounded-xl mb-4 outline-none border border-white/10 text-white focus:border-[#5865f2] text-center" 
                            />
                            <button onClick={saveUsername} className="w-full bg-[#5865f2] py-4 rounded-xl font-bold text-white hover:bg-[#4752c4] transition-colors">Enter Chat</button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="flex chat-container w-full bg-[#313338] text-[#dbdee1]">
                    {/* Sidebar */}
                    <div className={`fixed inset-y-0 left-0 z-50 w-64 bg-[#2b2d31] transform transition-transform lg:relative lg:translate-x-0 ${isDrawerOpen ? 'translate-x-0' : '-translate-x-full'}`}>
                        <div className="h-12 flex items-center px-4 border-b border-[#1e1f22] shadow-sm font-bold text-white">
                            Servers
                        </div>
                        <div className="p-2 space-y-1">
                            <div className="bg-[#3f4147] text-white p-2 rounded flex items-center cursor-pointer">
                                <i data-lucide="hash" className="w-4 h-4 mr-2"></i> general-lobby
                            </div>
                        </div>
                        <div className="absolute bottom-0 w-full p-3 bg-[#232428] flex items-center space-x-3">
                            <div className="w-8 h-8 bg-[#5865f2] rounded-full flex items-center justify-center font-bold text-xs">{username[0]?.toUpperCase()}</div>
                            <div className="flex-1 min-w-0">
                                <div className="text-white text-xs font-bold truncate">{username}</div>
                                <div className="text-[10px] text-[#949ba4] truncate">Connected</div>
                            </div>
                        </div>
                    </div>

                    {/* Chat Area */}
                    <div className="flex-1 flex flex-col min-w-0">
                        <div className="h-12 border-b border-[#1e1f22] flex items-center px-4 justify-between bg-[#313338] z-10">
                            <div className="flex items-center">
                                <button onClick={() => setIsDrawerOpen(!isDrawerOpen)} className="lg:hidden mr-3"><i data-lucide="menu"></i></button>
                                <i data-lucide="hash" className="w-5 h-5 mr-2 text-[#80848e]"></i>
                                <span className="font-bold text-white">{currentServerId}</span>
                            </div>
                        </div>

                        <div ref={scrollRef} className="flex-1 overflow-y-auto p-4 space-y-4">
                            {messages.length === 0 && (
                                <div className="h-full flex flex-col items-center justify-center text-[#949ba4] opacity-50">
                                    <i data-lucide="message-square" className="w-12 h-12 mb-2"></i>
                                    <p>No messages yet. Say hello!</p>
                                </div>
                            )}
                            {messages.map(m => (
                                <div key={m.id} className="flex items-start space-x-3 group hover:bg-[#2e3035] -mx-4 px-4 py-1">
                                    <div className="w-10 h-10 bg-[#5865f2] rounded-full flex-shrink-0 flex items-center justify-center font-bold text-white">
                                        {m.user?.[0]?.toUpperCase()}
                                    </div>
                                    <div>
                                        <div className="flex items-baseline space-x-2">
                                            <span className="font-bold text-white hover:underline cursor-pointer">{m.user}</span>
                                            <span className="text-[10px] text-[#949ba4]">
                                                {m.timestamp?.seconds ? new Date(m.timestamp.seconds * 1000).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '...'}
                                            </span>
                                        </div>
                                        <p className="text-[15px] leading-relaxed text-[#dbdee1] break-words">{m.content}</p>
                                    </div>
                                </div>
                            ))}
                        </div>

                        <div className="p-4 bg-[#313338]">
                            <div className="bg-[#383a40] rounded-lg px-4 flex items-center">
                                <input 
                                    className="flex-1 bg-transparent py-3 outline-none text-[#dbdee1]" 
                                    placeholder={`Message #${currentServerId}`} 
                                    value={inputText} 
                                    onChange={e => setInputText(e.target.value)} 
                                    onKeyDown={e => e.key === 'Enter' && handleSend()} 
                                />
                                <button onClick={handleSend} className="ml-2 text-[#b5bac1] hover:text-white">
                                    <i data-lucide="send" className="w-5 h-5"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
        
        // Icon Refresh
        setInterval(() => {
            if (window.lucide) window.lucide.createIcons();
        }, 1000);
    </script>
</body>
</html>
