<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #313338; margin: 0; color: #dbdee1; overflow: hidden; }
        .scale-in { animation: scaleIn 0.2s ease-out; }
        @keyframes scaleIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #2b2d31; }
        ::-webkit-scrollbar-thumb { background: #1e1f22; border-radius: 4px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp, doc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Environment variables provided by Canvas
        const firebaseConfig = JSON.parse(__firebase_config);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'discord-clone-v2';

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Expose SDK to window
        window.FirebaseSDK = { 
            auth, 
            db, 
            appId,
            collection, 
            addDoc, 
            onSnapshot, 
            serverTimestamp, 
            signInAnonymously, 
            onAuthStateChanged,
            signInWithCustomToken 
        };
        window.dispatchEvent(new Event('firebase-ready'));
    </script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const App = () => {
            const [fb, setFb] = useState(window.FirebaseSDK);
            const [user, setUser] = useState(null);
            const [username, setUsername] = useState(localStorage.getItem('chat-username') || '');
            const [isUsernameSet, setIsUsernameSet] = useState(!!localStorage.getItem('chat-username'));
            const [messages, setMessages] = useState([]);
            const [inputText, setInputText] = useState('');
            const [status, setStatus] = useState('Connecting to Cloud...');

            useEffect(() => {
                const handleReady = () => setFb(window.FirebaseSDK);
                if (!fb) {
                    window.addEventListener('firebase-ready', handleReady);
                    return () => window.removeEventListener('firebase-ready', handleReady);
                }
            }, [fb]);

            useEffect(() => {
                if (!fb) return;
                
                const initAuth = async () => {
                    try {
                        // Priority: Custom Token (Rule 3) then Anonymous
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await fb.signInWithCustomToken(fb.auth, __initial_auth_token);
                        } else {
                            await fb.signInAnonymously(fb.auth);
                        }
                    } catch (err) {
                        console.error("Auth error:", err);
                        setStatus('Connection Failed. Please ensure Anonymous Auth is enabled in Firebase Console.');
                    }
                };

                initAuth();
                const unsubscribe = fb.onAuthStateChanged(fb.auth, (currentUser) => {
                    setUser(currentUser);
                    if (currentUser) setStatus('Connected');
                });
                return () => unsubscribe();
            }, [fb]);

            useEffect(() => {
                if (!user || !fb) return;

                // Path Rule 1: /artifacts/{appId}/public/data/{collectionName}
                const messagesCol = fb.collection(fb.db, 'artifacts', fb.appId, 'public', 'data', 'messages');
                
                const unsubscribe = fb.onSnapshot(messagesCol, (snapshot) => {
                    const newMessages = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    // Sort in JS (Rule 2: No complex queries)
                    setMessages(newMessages.sort((a, b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0)));
                }, (error) => {
                    console.error("Firestore error:", error);
                    setStatus('Database access denied. Check Firebase rules.');
                });

                return () => unsubscribe();
            }, [user, fb]);

            const saveUsername = () => {
                if (username.trim() && username.length < 20) {
                    localStorage.setItem('chat-username', username.trim());
                    setIsUsernameSet(true);
                }
            };

            const sendMessage = async () => {
                if (!inputText.trim() || !user || !fb || inputText.length > 500) return;
                const text = inputText.trim();
                setInputText('');
                try {
                    const messagesCol = fb.collection(fb.db, 'artifacts', fb.appId, 'public', 'data', 'messages');
                    await fb.addDoc(messagesCol, {
                        user: username,
                        userId: user.uid,
                        content: text,
                        timestamp: fb.serverTimestamp()
                    });
                } catch (err) { console.error(err); }
            };

            if (!user) {
                return (
                    <div className="flex h-screen w-full items-center justify-center bg-[#1e1f22] text-[#dbdee1] p-6 text-center">
                        <div>
                            <i data-lucide="loader-2" className="w-8 h-8 animate-spin mx-auto mb-4 text-[#5865f2]"></i>
                            <p className="text-sm font-medium">{status}</p>
                            {status.includes('Auth') && (
                                <div className="mt-4 p-3 bg-red-900/20 text-red-400 rounded text-xs max-w-xs">
                                    Tip: In your Firebase Console, go to Authentication > Sign-in method and enable "Anonymous".
                                </div>
                            )}
                        </div>
                    </div>
                );
            }

            if (!isUsernameSet) {
                return (
                    <div className="flex h-screen w-full items-center justify-center bg-[#1e1f22]">
                        <div className="bg-[#313338] p-8 rounded-lg shadow-xl w-80 text-center scale-in border border-white/5">
                            <div className="w-16 h-16 bg-[#5865f2] rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg">
                                <i data-lucide="smile" className="w-8 h-8 text-white"></i>
                            </div>
                            <h2 className="text-xl font-bold mb-2 text-white">Welcome</h2>
                            <p className="text-xs text-[#949ba4] mb-6">Enter a safe nickname to join the chat.</p>
                            <input 
                                value={username} 
                                onChange={e => setUsername(e.target.value)} 
                                onKeyDown={e => e.key === 'Enter' && saveUsername()} 
                                placeholder="Safe Nickname"
                                maxLength={15}
                                className="w-full bg-[#1e1f22] p-2 rounded mb-4 outline-none border border-white/10 text-white focus:border-[#5865f2]" 
                            />
                            <button onClick={saveUsername} className="w-full bg-[#5865f2] py-2 rounded font-bold text-white hover:bg-[#4752c4]">Join Global Chat</button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="flex h-screen w-full bg-[#313338] text-[#dbdee1]">
                    {/* Servers Sidebar */}
                    <div className="w-[72px] bg-[#1e1f22] flex flex-col items-center py-3 space-y-2 flex-shrink-0">
                        <div className="w-12 h-12 rounded-[16px] bg-[#5865f2] text-white flex items-center justify-center cursor-pointer transition-all">
                            <i data-lucide="globe" className="w-6 h-6"></i>
                        </div>
                    </div>

                    {/* Channels Sidebar */}
                    <div className="w-60 bg-[#2b2d31] flex flex-col border-r border-black/20">
                        <div className="h-12 px-4 flex items-center border-b border-[#1e1f22] font-bold text-white shadow-sm">
                            Public Server
                        </div>
                        <div className="flex-1 p-2">
                            <div className="bg-[#3f4147] text-white flex items-center px-2 py-1.5 rounded-md">
                                <i data-lucide="hash" className="w-4 h-4 mr-2 opacity-50"></i>
                                <span className="font-medium text-sm">general</span>
                            </div>
                        </div>
                        <div className="bg-[#232428] p-2 flex items-center space-x-2">
                            <div className="w-8 h-8 bg-[#5865f2] rounded-full flex items-center justify-center font-bold text-xs uppercase">{username[0]}</div>
                            <div className="flex-1 min-w-0">
                                <div className="text-white text-xs font-bold truncate">{username}</div>
                                <div className="text-[10px] text-[#23a559] uppercase font-bold">Online</div>
                            </div>
                            <button onClick={() => { localStorage.clear(); window.location.reload(); }} className="p-1 hover:bg-white/10 rounded">
                                <i data-lucide="log-out" className="w-4 h-4 text-[#b5bac1]"></i>
                            </button>
                        </div>
                    </div>

                    {/* Main Chat Area */}
                    <div className="flex-1 flex flex-col min-w-0">
                        <div className="h-12 border-b border-black/20 flex items-center px-4 shadow-sm">
                            <i data-lucide="hash" className="w-5 h-5 text-[#80848e] mr-2"></i>
                            <span className="font-bold text-white text-sm">general</span>
                        </div>
                        
                        <div className="flex-1 overflow-y-auto p-4 flex flex-col-reverse space-y-4">
                            {messages.map(m => (
                                <div key={m.id} className="flex items-start space-x-3 p-1 rounded hover:bg-black/5 group">
                                    <div className="w-10 h-10 bg-[#5865f2] rounded-full flex-shrink-0 flex items-center justify-center font-bold text-white uppercase">{m.user ? m.user[0] : '?'}</div>
                                    <div className="min-w-0">
                                        <div className="flex items-baseline space-x-2">
                                            <span className="font-bold text-white text-sm hover:underline cursor-pointer">{m.user}</span>
                                            <span className="text-[10px] text-[#949ba4]">
                                                {m.timestamp?.seconds ? new Date(m.timestamp.seconds * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '...'}
                                            </span>
                                        </div>
                                        <p className="text-sm text-[#dbdee1] break-words">{m.content}</p>
                                    </div>
                                </div>
                            ))}
                        </div>

                        <div className="p-4">
                            <div className="bg-[#383a40] rounded-lg px-4 py-2.5 flex items-center shadow-inner">
                                <input 
                                    className="flex-1 bg-transparent outline-none text-sm text-[#dbdee1] placeholder-[#949ba4]" 
                                    placeholder="Message #general" 
                                    value={inputText} 
                                    maxLength={500}
                                    onChange={e => setInputText(e.target.value)} 
                                    onKeyDown={e => e.key === 'Enter' && sendMessage()} 
                                />
                                <div className="flex space-x-3 ml-2 text-[#b5bac1]">
                                    <i data-lucide="smile" className="w-5 h-5 cursor-pointer hover:text-white" onClick={sendMessage}></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
        setInterval(() => window.lucide && window.lucide.createIcons(), 1000);
    </script>
</body>
</html>
