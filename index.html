<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cloud Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #313338; 
            margin: 0; 
            color: #dbdee1; 
            overflow: hidden;
        }
        .scale-in { animation: scaleIn 0.2s ease-out; }
        @keyframes scaleIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .chat-container { height: 100dvh; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #1e1f22; border-radius: 4px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- Firebase SDK Loader -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp, doc, setDoc, deleteDoc, query, where, getDocs, limit, updateDoc, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Safety check for environment variables
        const rawConfig = typeof __firebase_config !== 'undefined' ? __firebase_config : '{}';
        const firebaseConfig = JSON.parse(rawConfig);
        
        try {
            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);
            const db = getFirestore(app);
            const appId = typeof __app_id !== 'undefined' ? __app_id : 'cloud-chat-v1';

            // Export to window for the React component
            window.FirebaseCore = { 
                auth, db, appId,
                collection, addDoc, onSnapshot, serverTimestamp, 
                signInAnonymously, signInWithCustomToken, onAuthStateChanged, 
                doc, setDoc, deleteDoc, query, where, getDocs, limit,
                updateDoc, arrayUnion, arrayRemove
            };
            window.dispatchEvent(new Event('firebase-ready'));
        } catch (e) {
            console.error("Firebase Init Error:", e);
        }
    </script>

    <!-- React Application -->
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const App = () => {
            const [fbReady, setFbReady] = useState(!!window.FirebaseCore);
            const [user, setUser] = useState(null);
            const [status, setStatus] = useState('Waiting for SDK...');
            const [username, setUsername] = useState(localStorage.getItem('chat-username') || '');
            const [isUsernameSet, setIsUsernameSet] = useState(!!localStorage.getItem('chat-username'));
            const [messages, setMessages] = useState([]);
            const [inputText, setInputText] = useState('');
            const scrollRef = useRef(null);

            // Watch for Firebase to be ready
            useEffect(() => {
                const handleReady = () => setFbReady(true);
                window.addEventListener('firebase-ready', handleReady);
                return () => window.removeEventListener('firebase-ready', handleReady);
            }, []);

            // 1. Handle Authentication (Mandatory Rule 3)
            useEffect(() => {
                if (!fbReady) return;
                const fb = window.FirebaseCore;

                const performAuth = async () => {
                    try {
                        setStatus('Authenticating...');
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await fb.signInWithCustomToken(fb.auth, __initial_auth_token);
                        } else {
                            await fb.signInAnonymously(fb.auth);
                        }
                    } catch (err) {
                        console.error("Auth Error:", err);
                        setStatus('Connection Failed');
                    }
                };

                performAuth();

                const unsubscribe = fb.onAuthStateChanged(fb.auth, (u) => {
                    if (u) {
                        setUser(u);
                        setStatus('Connected');
                        // Update presence
                        fb.setDoc(fb.doc(fb.db, 'artifacts', fb.appId, 'public', 'data', 'userPresence', u.uid), {
                            username: username || 'Guest',
                            lastSeen: fb.serverTimestamp()
                        }, { merge: true });
                    }
                });

                return () => unsubscribe();
            }, [fbReady]);

            // 2. Listen for Messages (Mandatory Rule 1 & 2)
            useEffect(() => {
                if (!user || !fbReady) return;
                const fb = window.FirebaseCore;

                const msgCol = fb.collection(fb.db, 'artifacts', fb.appId, 'public', 'data', 'messages_general');
                
                const unsubscribe = fb.onSnapshot(msgCol, (snap) => {
                    const msgs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    // Sort in memory (Rule 2)
                    setMessages(msgs.sort((a, b) => (a.timestamp?.seconds || 0) - (b.timestamp?.seconds || 0)));
                }, (err) => {
                    console.error("Message Error:", err);
                });

                return () => unsubscribe();
            }, [user, fbReady]);

            useEffect(() => {
                if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
            }, [messages]);

            const handleSend = async () => {
                if (!inputText.trim() || !user || !fbReady) return;
                const fb = window.FirebaseCore;
                const text = inputText.trim();
                setInputText('');

                try {
                    const msgCol = fb.collection(fb.db, 'artifacts', fb.appId, 'public', 'data', 'messages_general');
                    await fb.addDoc(msgCol, {
                        user: username || 'Anonymous',
                        userId: user.uid,
                        content: text,
                        timestamp: fb.serverTimestamp()
                    });
                } catch (e) {
                    console.error("Send Error:", e);
                }
            };

            // Loading / Initializing UI
            if (!user) {
                return (
                    <div className="flex h-screen items-center justify-center bg-[#1e1f22] text-[#949ba4]">
                        <div className="text-center">
                            <div className="w-10 h-10 border-4 border-[#5865f2] border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
                            <p className="text-xs font-bold uppercase tracking-[0.2em] animate-pulse">
                                {fbReady ? status : 'Initializing...'}
                            </p>
                        </div>
                    </div>
                );
            }

            // Username Choice
            if (!isUsernameSet) {
                return (
                    <div className="flex h-screen items-center justify-center bg-[#1e1f22] p-6">
                        <div className="bg-[#313338] p-8 rounded-2xl shadow-2xl w-full max-w-sm border border-white/5 scale-in">
                            <h2 className="text-xl font-bold mb-2 text-white text-center">Cloud Chat</h2>
                            <p className="text-[#949ba4] text-xs text-center mb-6">Choose a nickname to start</p>
                            <input 
                                value={username} 
                                onChange={e => setUsername(e.target.value)} 
                                onKeyDown={e => e.key === 'Enter' && username.trim() && setIsUsernameSet(true)}
                                placeholder="Enter a name..." 
                                className="w-full bg-[#1e1f22] p-4 rounded-xl mb-4 outline-none border border-white/10 text-white focus:border-[#5865f2] text-center" 
                            />
                            <button 
                                onClick={() => username.trim() && setIsUsernameSet(true)} 
                                className="w-full bg-[#5865f2] py-4 rounded-xl font-bold text-white hover:bg-[#4752c4] transition-all active:scale-95"
                            >
                                Enter Chat
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="flex flex-col h-screen w-full bg-[#313338] text-[#dbdee1]">
                    {/* Header */}
                    <div className="h-12 border-b border-[#1e1f22] flex items-center px-4 justify-between bg-[#313338] shrink-0">
                        <div className="flex items-center gap-2">
                            <i data-lucide="hash" className="w-5 h-5 text-[#80848e]"></i>
                            <span className="font-bold text-white">general-lobby</span>
                        </div>
                        <div className="text-[10px] bg-[#232428] px-2 py-1 rounded font-bold text-[#949ba4] tracking-tighter uppercase">
                            User: {username}
                        </div>
                    </div>

                    {/* Messages */}
                    <div ref={scrollRef} className="flex-1 overflow-y-auto p-4 space-y-4">
                        {messages.length === 0 && (
                            <div className="h-full flex flex-col items-center justify-center text-[#949ba4] opacity-30">
                                <i data-lucide="message-circle" className="w-12 h-12 mb-2"></i>
                                <p className="text-sm font-medium">Channel is quiet...</p>
                            </div>
                        )}
                        {messages.map(m => (
                            <div key={m.id} className="flex items-start space-x-3 group hover:bg-[#2e3035] -mx-4 px-4 py-1 transition-colors">
                                <div className="w-10 h-10 bg-[#5865f2] rounded-full shrink-0 flex items-center justify-center font-bold text-white shadow-lg">
                                    {m.user?.[0]?.toUpperCase() || '?'}
                                </div>
                                <div className="min-w-0">
                                    <div className="flex items-baseline space-x-2">
                                        <span className="font-bold text-white">{m.user}</span>
                                        <span className="text-[10px] text-[#949ba4]">
                                            {m.timestamp?.seconds ? new Date(m.timestamp.seconds * 1000).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '...'}
                                        </span>
                                    </div>
                                    <p className="text-[15px] leading-relaxed text-[#dbdee1] break-words">{m.content}</p>
                                </div>
                            </div>
                        ))}
                    </div>

                    {/* Input */}
                    <div className="p-4 bg-[#313338]">
                        <div className="bg-[#383a40] rounded-xl px-4 flex items-center shadow-inner ring-1 ring-white/5 focus-within:ring-[#5865f2]/50 transition-all">
                            <input 
                                className="flex-1 bg-transparent py-3 outline-none text-[#dbdee1] placeholder-[#949ba4]" 
                                placeholder="Message #general-lobby" 
                                value={inputText} 
                                onChange={e => setInputText(e.target.value)} 
                                onKeyDown={e => e.key === 'Enter' && handleSend()} 
                            />
                            <button onClick={handleSend} className="ml-2 text-[#b5bac1] hover:text-[#5865f2] transition-colors p-2">
                                <i data-lucide="send" className="w-5 h-5"></i>
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
        
        // Refresh icons
        setInterval(() => window.lucide && window.lucide.createIcons(), 1000);
    </script>
</body>
</html>
