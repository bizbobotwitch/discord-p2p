<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Discord Clone</title>
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore-compat.js"></script>
    <!-- PeerJS for Voice Chat -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { margin:0; font-family:'Whitney','Helvetica Neue',Helvetica,Arial,sans-serif; background:#36393f; color:#dcddde; display:flex; height:100vh; overflow:hidden; }
        #login-screen { position:fixed; inset:0; background:#36393f; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:100; }
        #login-screen input, #login-screen button { padding:12px; width:300px; margin:10px; border-radius:8px; border:none; font-size:1em; }
        #login-screen button { background:#5865f2; color:white; cursor:pointer; }
        #app { display:flex; width:100%; height:100%; }
        #servers { width:72px; background:#202225; padding-top:12px; align-items:center; display:flex; flex-direction:column; overflow-y:auto; }
        .server { width:50px; height:50px; background:#36393f; border-radius:50%; margin:8px 0; cursor:pointer; display:flex; align-items:center; justify-content:center; font-weight:bold; font-size:1.2em; overflow: hidden; transition: 0.2s; }
        .server:hover { border-radius:16px; background:#5865f2; }
        .server.active { border-radius:16px; background:#5865f2; }
        .add-server { background:#36393f; color:#43b581; font-size: 2em; }
        #sidebar { width:240px; background:#2f3136; display:flex; flex-direction:column; }
        #server-header { padding:16px; font-size:1.4em; font-weight:bold; border-bottom:1px solid #202225; }
        #channels { flex:1; overflow-y:auto; }
        .channel-cat { padding:8px 16px; text-transform:uppercase; font-size:0.8em; color:#8e9297; }
        .channel { padding:8px 16px; cursor:pointer; border-radius:4px; margin:2px 8px; }
        .channel:hover, .channel.active { background:#393c43; color: white; }
        #friends-section { border-top:1px solid #202225; padding:16px; }
        #friends-list .friend { padding:8px; display:flex; align-items:center; cursor:pointer; border-radius:4px; }
        #friends-list .friend:hover { background:#393c43; }
        #friends-list .friend .status { width:10px; height:10px; border-radius:50%; background:#43b581; margin-right:10px; }
        #main { flex:1; display:flex; flex-direction:column; background:#36393f; }
        #topbar { height:48px; background:#36393f; padding:0 16px; display:flex; align-items:center; justify-content:space-between; box-shadow:0 1px 0 rgba(4,4,5,0.2); }
        #channel-name { font-size:1.1em; font-weight:bold; }
        #voice-controls button { background:#43b581; margin-left:8px; padding:8px 16px; border:none; border-radius:4px; cursor:pointer; color:white; }
        #messages { flex:1; padding:20px; overflow-y:auto; display:flex; flex-direction:column; }
        .message { margin-bottom:16px; max-width:100%; }
        .message .author { font-weight:bold; margin-bottom:4px; display:flex; align-items:center; }
        .message .time { font-size:0.75em; color:#72767d; margin-left:8px; font-weight: normal; }
        #input-area { height:70px; background:#40444b; padding:10px 20px; display:flex; align-items:center; }
        #message-input { flex:1; background:#36393f; border:none; border-radius:8px; padding:12px; color:white; font-size:1em; }
        #message-input:focus { outline:none; }
        .modal { position:fixed; inset:0; background:rgba(0,0,0,0.8); display:none; align-items:center; justify-content:center; z-index:200; }
        .modal-content { background:#36393f; padding:20px; border-radius:8px; width:400px; }
        .hidden { display:none !important; }
    </style>
</head>
<body>

<div id="login-screen">
    <h1>My Discord Clone</h1>
    <input type="text" id="username-input" placeholder="Choose a username" maxlength="32">
    <button onclick="login()">Join</button>
</div>

<div id="app" class="hidden">
    <div id="servers">
        <div class="server add-server" onclick="showCreateServerModal()">+</div>
    </div>

    <div id="sidebar">
        <div id="server-header">Select a Server</div>
        <div id="channels">
            <div class="channel-cat">Text Channels</div>
            <!-- Dynamic Channels -->
        </div>
        <div id="friends-section">
            <div style="padding:8px 16px; text-transform:uppercase; font-size:0.8em; color:#8e9297;">Friends</div>
            <div style="padding:0 16px;"><input type="text" id="add-friend-input" placeholder="Add friend by username" style="width:100%; padding:8px; background:#202225; border:none; border-radius:4px; color:white;"></div>
            <div id="friends-list"></div>
        </div>
    </div>

    <div id="main">
        <div id="topbar">
            <div id="channel-name"># welcome</div>
            <div id="voice-controls">
                <button id="voice-btn" onclick="toggleVoice()">🎤 Join Voice</button>
            </div>
        </div>
        <div id="messages"></div>
        <div id="input-area">
            <input type="text" id="message-input" placeholder="Message #general" disabled>
        </div>
    </div>
</div>

<!-- Modals -->
<div id="create-server-modal" class="modal">
    <div class="modal-content">
        <h2>Create a Server</h2>
        <input type="text" id="server-name-input" placeholder="Server Name" style="width: 100%; box-sizing: border-box;">
        <div style="margin-top: 15px; display: flex; gap: 10px;">
            <button onclick="createServer()" style="flex: 1; background: #5865f2; color: white; padding: 10px; border-radius: 4px; border: none; cursor: pointer;">Create</button>
            <button onclick="closeModal('create-server-modal')" style="flex: 1; background: #4f545c; color: white; padding: 10px; border-radius: 4px; border: none; cursor: pointer;">Cancel</button>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = JSON.parse(__firebase_config);
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'discord-clone';
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    let currentUserData = null;
    let currentServer = null;
    let currentChannel = 'general';
    let unsubscribeMessages = null;
    let voiceStream = null;
    const colors = ['#e91e63','#9c27b0','#673ab7','#3f51b5','#2196f3','#00bcd4','#009688','#4caf50','#cddc39','#ffeb3b','#ffc107','#ff9800','#ff5722'];

    // Auth & Login
    async function login() {
        const username = document.getElementById('username-input').value.trim();
        if (!username) return alert("Enter a username!");
        
        // Auth First (Rule 3)
        try {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await auth.signInWithCustomToken(__initial_auth_token);
            } else {
                await auth.signInAnonymously();
            }
            
            const uid = auth.currentUser.uid;
            currentUserData = { username, uid };
            
            // Store user profile (Rule 1: private path)
            await db.collection('artifacts').doc(appId).collection('users').doc(uid).set({
                username,
                usernameLower: username.toLowerCase(),
                friends: [],
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true });

            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
            
            loadServers();
            loadFriends();
        } catch (e) {
            console.error(e);
            alert("Login failed. Check console.");
        }
    }

    // Server Management
    async function createServer() {
        if (!auth.currentUser) return;
        const name = document.getElementById('server-name-input').value.trim();
        if (!name) return;

        // Rule 1: Public data path
        const serverRef = await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('servers').add({
            name,
            owner: auth.currentUser.uid,
            members: [auth.currentUser.uid],
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        closeModal('create-server-modal');
        loadServers(); // Refresh list
    }

    function loadServers() {
        if (!auth.currentUser) return;
        
        // Rule 2: Simple query
        db.collection('artifacts').doc(appId).collection('public').doc('data').collection('servers')
            .onSnapshot(snapshot => {
                const serversDiv = document.getElementById('servers');
                serversDiv.innerHTML = '<div class="server add-server" onclick="showCreateServerModal()">+</div>';
                
                snapshot.forEach(doc => {
                    const data = doc.data();
                    // Basic filtering in memory to ensure user is a member
                    if (data.members.includes(auth.currentUser.uid)) {
                        const serverEl = document.createElement('div');
                        serverEl.className = 'server' + (currentServer === doc.id ? ' active' : '');
                        serverEl.textContent = data.name.slice(0,2).toUpperCase();
                        serverEl.title = data.name;
                        serverEl.onclick = (e) => switchServer(doc.id, data, e.currentTarget);
                        serversDiv.appendChild(serverEl);
                    }
                });
            }, err => console.error("Server Load Error:", err));
    }

    async function switchServer(serverId, data, el) {
        currentServer = serverId;
        document.getElementById('server-header').textContent = data.name;
        document.querySelectorAll('.server').forEach(s => s.classList.remove('active'));
        el.classList.add('active');
        
        loadChannels();
        switchChannel('general');
    }

    function loadChannels() {
        const channelsDiv = document.getElementById('channels');
        channelsDiv.innerHTML = `
            <div class="channel-cat">Text Channels</div>
            <div class="channel active" onclick="switchChannel('general')"># general</div>
            <div class="channel" onclick="switchChannel('random')"># random</div>
            <div class="channel" onclick="switchChannel('gaming')"># gaming</div>
        `;
    }

    function switchChannel(channelId) {
        currentChannel = channelId;
        document.getElementById('channel-name').textContent = `# ${channelId}`;
        const input = document.getElementById('message-input');
        input.placeholder = `Message #${channelId}`;
        input.disabled = false;
        
        document.querySelectorAll('.channel').forEach(c => {
            c.classList.toggle('active', c.textContent.trim() === `# ${channelId}`);
        });

        loadMessages();
    }

    // Message Management
    function loadMessages() {
        if (unsubscribeMessages) unsubscribeMessages();
        if (!currentServer) return;

        const path = `artifacts/${appId}/public/data/servers/${currentServer}/channels/${currentChannel}/messages`;
        
        unsubscribeMessages = db.collection(path)
            .onSnapshot(snapshot => {
                const msgsContainer = document.getElementById('messages');
                msgsContainer.innerHTML = '';
                
                let messages = [];
                snapshot.forEach(doc => messages.push(doc.data()));
                
                // Sort in memory (Rule 2)
                messages.sort((a,b) => (a.timestamp?.seconds || 0) - (b.timestamp?.seconds || 0));

                messages.forEach(data => {
                    const div = document.createElement('div');
                    div.className = 'message';
                    const color = colors[Math.abs(data.uid.charCodeAt(0)) % colors.length];
                    const time = data.timestamp ? data.timestamp.toDate().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : "...";
                    div.innerHTML = `
                        <div class="author" style="color:${color}">${data.username}<span class="time">${time}</span></div>
                        <div class="content">${escapeHTML(data.text)}</div>
                    `;
                    msgsContainer.appendChild(div);
                });
                msgsContainer.scrollTop = msgsContainer.scrollHeight;
            }, err => console.error("Message Load Error:", err));
    }

    document.getElementById('message-input').addEventListener('keypress', async e => {
        if (e.key === 'Enter') {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (text && currentServer && auth.currentUser) {
                const path = `artifacts/${appId}/public/data/servers/${currentServer}/channels/${currentChannel}/messages`;
                input.value = '';
                await db.collection(path).add({
                    text,
                    username: currentUserData.username,
                    uid: auth.currentUser.uid,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
            }
        }
    });

    // Friends System
    function loadFriends() {
        if (!auth.currentUser) return;
        
        db.collection('artifacts').doc(appId).collection('users').doc(auth.currentUser.uid)
            .onSnapshot(async doc => {
                const friendsList = document.getElementById('friends-list');
                friendsList.innerHTML = '';
                const friends = doc.data()?.friends || [];
                
                for (let uid of friends) {
                    const userSnap = await db.collection('artifacts').doc(appId).collection('users').doc(uid).get();
                    if (userSnap.exists) {
                        const friend = userSnap.data();
                        const el = document.createElement('div');
                        el.className = 'friend';
                        el.innerHTML = `<div class="status"></div>${friend.username}`;
                        friendsList.appendChild(el);
                    }
                }
            });
    }

    document.getElementById('add-friend-input').addEventListener('keypress', async e => {
        if (e.key === 'Enter') {
            const targetUsername = e.target.value.trim();
            if (!targetUsername || !auth.currentUser) return;

            // Search by usernameLower (Rule 2: simple query)
            const snap = await db.collection('artifacts').doc(appId).collection('users')
                .where('usernameLower', '==', targetUsername.toLowerCase()).get();
                
            if (snap.empty) return alert("User not found");
            const friendUid = snap.docs[0].id;
            if (friendUid === auth.currentUser.uid) return alert("Can't add yourself");

            // Add for both users
            await db.collection('artifacts').doc(appId).collection('users').doc(auth.currentUser.uid).update({
                friends: firebase.firestore.FieldValue.arrayUnion(friendUid)
            });
            await db.collection('artifacts').doc(appId).collection('users').doc(friendUid).update({
                friends: firebase.firestore.FieldValue.arrayUnion(auth.currentUser.uid)
            });
            
            e.target.value = '';
        }
    });

    // Modals
    function showCreateServerModal() { document.getElementById('create-server-modal').style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    // Helpers
    function escapeHTML(str) {
        const p = document.createElement('p');
        p.textContent = str;
        return p.innerHTML;
    }

    // Voice Chat Mock
    async function toggleVoice() {
        if (!voiceStream) {
            try {
                voiceStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                document.getElementById('voice-btn').textContent = '🔴 Leave Voice';
                document.getElementById('voice-btn').style.background = '#ed4245';
            } catch (e) {
                alert("Could not access microphone.");
            }
        } else {
            voiceStream.getTracks().forEach(t => t.stop());
            voiceStream = null;
            document.getElementById('voice-btn').textContent = '🎤 Join Voice';
            document.getElementById('voice-btn').style.background = '#43b581';
        }
    }
</script>
</body>
</html>
