<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cloud Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #313338; 
            margin: 0; 
            color: #dbdee1; 
            overflow: hidden;
            touch-action: manipulation;
        }
        .scale-in { animation: scaleIn 0.2s ease-out; }
        @keyframes scaleIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .drawer-transition { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #1e1f22; border-radius: 4px; }
        .chat-container { height: 100dvh; }
        .voice-active-ring {
            box-shadow: 0 0 0 2px #23a559;
            animation: pulse-green 2s infinite;
        }
        @keyframes pulse-green {
            0% { box-shadow: 0 0 0 0 rgba(35, 165, 89, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(35, 165, 89, 0); }
            100% { box-shadow: 0 0 0 0 rgba(35, 165, 89, 0); }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp, doc, setDoc, deleteDoc, query, where, getDocs, limit, updateDoc, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.FirebaseSDK = { 
            auth, db, 
            collection, addDoc, onSnapshot, serverTimestamp, 
            signInAnonymously, signInWithCustomToken, onAuthStateChanged, doc, setDoc, deleteDoc, query, where, getDocs, limit,
            updateDoc, arrayUnion, arrayRemove
        };
        window.dispatchEvent(new Event('firebase-ready'));
    </script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const App = () => {
            const [fb, setFb] = useState(window.FirebaseSDK);
            const [user, setUser] = useState(null);
            const [username, setUsername] = useState(localStorage.getItem('chat-username') || '');
            const [currentServerId, setCurrentServerId] = useState(localStorage.getItem('chat-server-id') || 'general-lobby');
            const [myServers, setMyServers] = useState(JSON.parse(localStorage.getItem('my-servers') || '["general-lobby"]'));
            const [isUsernameSet, setIsUsernameSet] = useState(!!localStorage.getItem('chat-username'));
            
            const [messages, setMessages] = useState([]);
            const [inputText, setInputText] = useState('');
            const [status, setStatus] = useState('Connecting...');
            const [isDrawerOpen, setIsDrawerOpen] = useState(false);
            const [showServerModal, setShowServerModal] = useState(false);
            const [newServerInput, setNewServerInput] = useState('');
            
            const [friends, setFriends] = useState([]);
            const [friendRequests, setFriendRequests] = useState([]);
            const [view, setView] = useState('chat');
            const [friendInput, setFriendInput] = useState('');

            const [isVoiceConnected, setIsVoiceConnected] = useState(false);
            const [voiceParticipants, setVoiceParticipants] = useState([]);
            const [showCallScreen, setShowCallScreen] = useState(false);
            const localStream = useRef(null);
            const scrollRef = useRef(null);

            const appId = typeof __app_id !== 'undefined' ? __app_id : 'cloud-chat-v1';

            useEffect(() => {
                const handleReady = () => setFb(window.FirebaseSDK);
                if (!window.FirebaseSDK) window.addEventListener('firebase-ready', handleReady);
                else setFb(window.FirebaseSDK);
                return () => window.removeEventListener('firebase-ready', handleReady);
            }, []);

            useEffect(() => {
                if (!fb) return;
                
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await fb.signInWithCustomToken(fb.auth, __initial_auth_token);
                        } else {
                            await fb.signInAnonymously(fb.auth);
                        }
                    } catch (err) {
                        console.error("Auth error:", err);
                        setStatus('Auth Failed');
                    }
                };

                initAuth();
                const unsubscribe = fb.onAuthStateChanged(fb.auth, (u) => {
                    setUser(u);
                    if (u) {
                        setStatus('Connected');
                        fb.setDoc(fb.doc(fb.db, 'artifacts', appId, 'public', 'data', 'userPresence', u.uid), {
                            username: username || 'Anonymous',
                            uid: u.uid,
                            lastActive: fb.serverTimestamp()
                        }, { merge: true });
                    }
                });
                return () => unsubscribe();
            }, [fb, username]);

            useEffect(() => {
                if (!user || !fb) return;
                
                const socialDoc = fb.doc(fb.db, 'artifacts', appId, 'users', user.uid, 'social', 'socialData');
                const unsubFriends = fb.onSnapshot(socialDoc, (docSnap) => {
                    if (docSnap.exists()) setFriends(docSnap.data().friends || []);
                }, (err) => console.error("Friends listen err:", err));

                const reqCol = fb.collection(fb.db, 'artifacts', appId, 'users', user.uid, 'requests');
                const unsubReqs = fb.onSnapshot(reqCol, (snap) => {
                    setFriendRequests(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                }, (err) => console.error("Requests listen err:", err));

                return () => { unsubFriends(); unsubReqs(); };
            }, [user, fb]);

            useEffect(() => {
                if (!user || !fb || !currentServerId || view !== 'chat') return;
                // Rule 1: Always use /artifacts/{appId}/public/data/{collection}
                const col = fb.collection(fb.db, 'artifacts', appId, 'public', 'data', `messages_${currentServerId}`);
                const unsubMessages = fb.onSnapshot(col, (snap) => {
                    const msgs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    setMessages(msgs.sort((a, b) => (a.timestamp?.seconds || 0) - (b.timestamp?.seconds || 0)));
                }, (err) => console.error("Messages listen err:", err));
                return () => unsubMessages();
            }, [user, fb, currentServerId, view]);

            useEffect(() => {
                if (!user || !fb || !currentServerId) return;
                const col = fb.collection(fb.db, 'artifacts', appId, 'public', 'data', `voice_${currentServerId}`);
                const unsubVoice = fb.onSnapshot(col, (snap) => {
                    setVoiceParticipants(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                }, (err) => console.error("Voice listen err:", err));
                return () => unsubVoice();
            }, [user, fb, currentServerId]);

            useEffect(() => {
                if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
            }, [messages]);

            const saveUsername = () => {
                if (username.trim()) {
                    localStorage.setItem('chat-username', username.trim());
                    setIsUsernameSet(true);
                }
            };

            const sendFriendRequest = async () => {
                const targetUid = friendInput.trim();
                if (!targetUid || targetUid === user.uid || !fb) return;
                try {
                    const targetReqCol = fb.collection(fb.db, 'artifacts', appId, 'users', targetUid, 'requests');
                    await fb.addDoc(targetReqCol, {
                        fromName: username,
                        fromUid: user.uid,
                        type: 'friend_request',
                        timestamp: fb.serverTimestamp()
                    });
                    setFriendInput('');
                    alert("Request Sent!");
                } catch (e) { console.error(e); alert("Error sending request."); }
            };

            const acceptFriend = async (req) => {
                if (!fb || !user) return;
                const mySocialDoc = fb.doc(fb.db, 'artifacts', appId, 'users', user.uid, 'social', 'socialData');
                const theirSocialDoc = fb.doc(fb.db, 'artifacts', appId, 'users', req.fromUid, 'social', 'socialData');

                await fb.setDoc(mySocialDoc, { friends: fb.arrayUnion({ uid: req.fromUid, name: req.fromName }) }, { merge: true });
                await fb.setDoc(theirSocialDoc, { friends: fb.arrayUnion({ uid: user.uid, name: username }) }, { merge: true });
                await fb.deleteDoc(fb.doc(fb.db, 'artifacts', appId, 'users', user.uid, 'requests', req.id));
            };

            const inviteToCurrentServer = async (friend) => {
                if (!fb || !currentServerId) return;
                const inviteCol = fb.collection(fb.db, 'artifacts', appId, 'users', friend.uid, 'requests');
                await fb.addDoc(inviteCol, {
                    fromName: username,
                    type: 'server_invite',
                    serverId: currentServerId,
                    timestamp: fb.serverTimestamp()
                });
                alert(`Invite to ${currentServerId} sent!`);
            };

            const joinServer = async (id) => {
                const cleanId = id.trim().toLowerCase().replace(/\s+/g, '-');
                if (!cleanId || !fb || !user) return;
                if (isVoiceConnected) toggleVoice();
                setCurrentServerId(cleanId);
                localStorage.setItem('chat-server-id', cleanId);
                if (!myServers.includes(cleanId)) {
                    const newList = [cleanId, ...myServers].slice(0, 10);
                    setMyServers(newList);
                    localStorage.setItem('my-servers', JSON.stringify(newList));
                }
                setShowServerModal(false);
                setNewServerInput('');
                setView('chat');
                setIsDrawerOpen(false);
            };

            const sendMessage = async () => {
                if (!inputText.trim() || !user || !fb) return;
                const text = inputText.trim();
                setInputText('');
                const col = fb.collection(fb.db, 'artifacts', appId, 'public', 'data', `messages_${currentServerId}`);
                await fb.addDoc(col, {
                    user: username,
                    userId: user.uid,
                    content: text,
                    timestamp: fb.serverTimestamp()
                });
            };

            const toggleVoice = async () => {
                if (isVoiceConnected) {
                    if (localStream.current) localStream.current.getTracks().forEach(t => t.stop());
                    await fb.deleteDoc(fb.doc(fb.db, 'artifacts', appId, 'public', 'data', `voice_${currentServerId}`, user.uid));
                    setIsVoiceConnected(false);
                    setShowCallScreen(false);
                } else {
                    try {
                        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                        localStream.current = stream;
                        await fb.setDoc(fb.doc(fb.db, 'artifacts', appId, 'public', 'data', `voice_${currentServerId}`, user.uid), {
                            uid: user.uid,
                            name: username,
                            isMuted: false,
                            joinedAt: Date.now()
                        });
                        setIsVoiceConnected(true);
                        setShowCallScreen(true);
                    } catch (err) { console.error(err); }
                }
            };

            if (!user) return (
                <div className="flex h-screen w-full items-center justify-center bg-[#1e1f22]">
                    <div className="text-center">
                        <div className="w-12 h-12 border-4 border-[#5865f2] border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
                        <p className="text-sm font-medium text-[#949ba4]">{status}</p>
                    </div>
                </div>
            );

            if (!isUsernameSet) return (
                <div className="flex h-screen w-full items-center justify-center bg-[#1e1f22] p-6">
                    <div className="bg-[#313338] p-8 rounded-3xl shadow-2xl w-full max-sm text-center border border-white/5 scale-in">
                        <h2 className="text-2xl font-bold mb-6 text-white">Welcome</h2>
                        <input value={username} onChange={e => setUsername(e.target.value)} placeholder="Enter nickname..." className="w-full bg-[#1e1f22] p-4 rounded-xl mb-4 outline-none border border-white/10 text-white focus:border-[#5865f2] text-center" />
                        <button onClick={saveUsername} className="w-full bg-[#5865f2] py-4 rounded-xl font-bold text-white active:scale-95 transition-transform">Start Chatting</button>
                    </div>
                </div>
            );

            return (
                <div className="flex chat-container w-full bg-[#313338] text-[#dbdee1] overflow-hidden relative">
                    
                    {showCallScreen && (
                        <div className="fixed inset-0 bg-[#1e1f22] z-[60] flex flex-col scale-in">
                            <div className="flex-1 flex flex-wrap items-center justify-center gap-8 p-10 overflow-y-auto">
                                {voiceParticipants.map(p => (
                                    <div key={p.id} className="flex flex-col items-center">
                                        <div className={`w-32 h-32 rounded-full bg-[#313338] border-4 border-[#1e1f22] flex items-center justify-center text-4xl font-bold text-white uppercase relative ${!p.isMuted ? 'voice-active-ring' : ''}`}>
                                            {p.name?.[0] || '?'}
                                        </div>
                                        <span className="mt-4 font-bold text-white">{p.name}</span>
                                    </div>
                                ))}
                            </div>
                            <div className="h-24 bg-[#2b2d31] flex items-center justify-center space-x-6 border-t border-white/5">
                                <button onClick={() => setShowCallScreen(false)} className="p-4 rounded-full bg-[#4e5058] text-white"><i data-lucide="minimize-2"></i></button>
                                <button onClick={toggleVoice} className="p-4 rounded-full bg-[#ed4245] text-white"><i data-lucide="phone-off"></i></button>
                            </div>
                        </div>
                    )}

                    <div className={`fixed inset-y-0 left-0 z-50 w-72 bg-[#2b2d31] flex drawer-transition transform lg:relative lg:translate-x-0 ${isDrawerOpen ? 'translate-x-0' : '-translate-x-full'}`}>
                        <div className="w-[72px] bg-[#1e1f22] flex flex-col items-center py-3 space-y-3 flex-shrink-0 overflow-y-auto">
                            <div onClick={() => { setView('friends'); setIsDrawerOpen(false); }} className={`w-12 h-12 rounded-[24px] flex items-center justify-center cursor-pointer transition-all hover:rounded-[16px] relative ${view === 'friends' ? 'bg-[#5865f2] text-white rounded-[16px]' : 'bg-[#313338] hover:bg-[#23a559] hover:text-white'}`}>
                                <i data-lucide="users" className="w-5 h-5"></i>
                                {friendRequests.length > 0 && <div className="absolute top-0 right-0 w-4 h-4 bg-[#ed4245] rounded-full border-2 border-[#1e1f22]"></div>}
                            </div>
                            <div className="w-8 h-[2px] bg-white/5 rounded-full"></div>
                            {myServers.map(s => (
                                <div key={s} onClick={() => joinServer(s)} className={`w-12 h-12 rounded-[24px] flex items-center justify-center cursor-pointer transition-all hover:rounded-[16px] ${view === 'chat' && currentServerId === s ? 'bg-[#5865f2] text-white rounded-[16px]' : 'bg-[#313338] hover:bg-[#5865f2] hover:text-white'}`}>
                                    <span className="font-bold text-xs uppercase">{s.substring(0, 2)}</span>
                                </div>
                            ))}
                            <div onClick={() => setShowServerModal(true)} className="w-12 h-12 rounded-[24px] bg-[#313338] text-[#23a559] flex items-center justify-center cursor-pointer hover:bg-[#23a559] hover:text-white transition-all"><i data-lucide="plus"></i></div>
                        </div>

                        <div className="flex-1 flex flex-col min-w-0">
                            <div className="h-12 px-4 flex items-center border-b border-[#1e1f22] font-bold text-white truncate shadow-sm">
                                {view === 'friends' ? 'Social Hub' : currentServerId}
                            </div>
                            <div className="flex-1 p-3 overflow-y-auto space-y-4">
                                {view === 'chat' ? (
                                    <>
                                        <div className="text-[12px] uppercase font-bold text-[#949ba4] px-2">Text Channels</div>
                                        <div className="bg-[#3f4147] text-white flex items-center px-3 py-2 rounded-md"><i data-lucide="hash" className="w-4 h-4 mr-2 opacity-50"></i>general</div>
                                        <div className="text-[12px] uppercase font-bold text-[#949ba4] px-2 pt-4">Voice Channels</div>
                                        <div onClick={toggleVoice} className="flex items-center px-3 py-2 rounded-md hover:bg-[#35373c] cursor-pointer"><i data-lucide="volume-2" className="w-4 h-4 mr-2 opacity-50"></i>General Voice</div>
                                    </>
                                ) : (
                                    <>
                                        <div className="text-[12px] uppercase font-bold text-[#949ba4] px-2">Your Friends</div>
                                        {friends.map(f => (
                                            <div key={f.uid} className="flex items-center p-2 rounded-md hover:bg-white/5 group">
                                                <div className="w-8 h-8 rounded-full bg-[#5865f2] flex items-center justify-center font-bold text-[10px] uppercase mr-2">{f.name?.[0] || 'U'}</div>
                                                <span className="text-sm flex-1 truncate">{f.name}</span>
                                                <button onClick={() => inviteToCurrentServer(f)} className="opacity-0 group-hover:opacity-100 p-2 text-[#23a559]"><i data-lucide="user-plus" className="w-4 h-4"></i></button>
                                            </div>
                                        ))}
                                    </>
                                )}
                            </div>
                            <div className="bg-[#232428] p-3 flex items-center space-x-3">
                                <div className="w-8 h-8 bg-[#5865f2] rounded-full flex items-center justify-center font-bold text-xs uppercase">{username[0]}</div>
                                <div className="flex-1 min-w-0">
                                    <div className="text-white text-xs font-bold truncate">{username}</div>
                                    <div className="text-[10px] text-[#949ba4] truncate">ID: {user.uid}</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div className="flex-1 flex flex-col min-w-0 bg-[#313338]">
                        <div className="h-12 border-b border-[#1e1f22] flex items-center px-4">
                            <button onClick={() => setIsDrawerOpen(true)} className="lg:hidden mr-3"><i data-lucide="menu"></i></button>
                            <span className="font-bold text-white text-sm">{view === 'friends' ? 'Social Dashboard' : `# general`}</span>
                        </div>

                        {view === 'chat' ? (
                            <>
                                <div ref={scrollRef} className="flex-1 overflow-y-auto p-4 space-y-4">
                                    {messages.map(m => (
                                        <div key={m.id} className="flex items-start space-x-3">
                                            <div className="w-10 h-10 bg-[#5865f2] rounded-full flex-shrink-0 flex items-center justify-center font-bold text-white uppercase">{m.user?.[0]}</div>
                                            <div>
                                                <div className="flex items-baseline space-x-2">
                                                    <span className="font-bold text-white">{m.user}</span>
                                                    <span className="text-[10px] text-[#949ba4]">{m.timestamp?.seconds ? new Date(m.timestamp.seconds*1000).toLocaleTimeString() : ''}</span>
                                                </div>
                                                <p className="text-[15px]">{m.content}</p>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                                <div className="p-4">
                                    <div className="bg-[#383a40] rounded-xl px-4 py-1 flex items-center">
                                        <input className="flex-1 bg-transparent py-3 outline-none" placeholder={`Message #${currentServerId}`} value={inputText} onChange={e => setInputText(e.target.value)} onKeyDown={e => e.key === 'Enter' && sendMessage()} />
                                    </div>
                                </div>
                            </>
                        ) : (
                            <div className="flex-1 p-6 space-y-8 max-w-2xl mx-auto w-full scale-in">
                                <div className="bg-[#2b2d31] p-6 rounded-2xl border border-white/5">
                                    <h3 className="font-bold text-white mb-4">Add Friend</h3>
                                    <div className="flex space-x-2">
                                        <input value={friendInput} onChange={e => setFriendInput(e.target.value)} className="flex-1 bg-[#1e1f22] p-3 rounded-xl border border-white/10 outline-none focus:border-[#5865f2]" placeholder="Paste User ID..." />
                                        <button onClick={sendFriendRequest} className="bg-[#5865f2] px-6 rounded-xl font-bold">Add</button>
                                    </div>
                                    <p className="text-[10px] text-[#949ba4] mt-3">Share your ID: <span className="text-white select-all bg-black/20 p-1 px-2 rounded">{user.uid}</span></p>
                                </div>

                                {friendRequests.length > 0 && (
                                    <div className="space-y-3">
                                        <h4 className="text-xs font-bold text-[#949ba4] uppercase">Pending Notifications</h4>
                                        {friendRequests.map(req => (
                                            <div key={req.id} className="bg-[#2b2d31] p-4 rounded-xl border border-[#23a559]/30 flex items-center justify-between">
                                                <p className="text-sm">
                                                    {req.type === 'server_invite' ? <span><b>{req.fromName}</b> invited you to <b>{req.serverId}</b></span> : <span>Friend request from <b>{req.fromName}</b></span>}
                                                </p>
                                                <div className="flex space-x-2">
                                                    {req.type === 'server_invite' ? (
                                                        <button onClick={() => { joinServer(req.serverId); fb.deleteDoc(fb.doc(fb.db, 'artifacts', appId, 'users', user.uid, 'requests', req.id)); }} className="bg-[#23a559] px-3 py-1 rounded font-bold text-xs uppercase">Join</button>
                                                    ) : (
                                                        <button onClick={() => acceptFriend(req)} className="bg-[#23a559] px-3 py-1 rounded font-bold text-xs uppercase">Accept</button>
                                                    )}
                                                    <button onClick={() => fb.deleteDoc(fb.doc(fb.db, 'artifacts', appId, 'users', user.uid, 'requests', req.id))} className="bg-[#4e5058] p-1 rounded"><i data-lucide="x" className="w-4 h-4"></i></button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}
                    </div>
                    
                    {showServerModal && (
                        <div className="fixed inset-0 bg-black/80 z-[70] flex items-center justify-center p-4">
                            <div className="bg-[#313338] w-full max-w-sm rounded-2xl p-6 border border-white/10 scale-in">
                                <h3 className="text-xl font-bold text-white mb-2">Join a Server</h3>
                                <input value={newServerInput} onChange={e => setNewServerInput(e.target.value)} placeholder="Server name..." className="w-full bg-[#1e1f22] p-3 rounded-xl mb-4 outline-none border border-white/10" autoFocus />
                                <div className="flex space-x-3">
                                    <button onClick={() => setShowServerModal(false)} className="flex-1 py-3 text-sm font-bold">Cancel</button>
                                    <button onClick={() => joinServer(newServerInput)} className="flex-1 bg-[#23a559] py-3 rounded-xl font-bold text-white">Go</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
        setInterval(() => window.lucide && window.lucide.createIcons(), 500);
    </script>
</body>
</html>
