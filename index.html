<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cloud Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #313338; margin: 0; color: #dbdee1; overflow: hidden; touch-action: manipulation; }
        .scale-in { animation: scaleIn 0.2s ease-out; }
        @keyframes scaleIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #1e1f22; border-radius: 4px; }
        .chat-container { height: 100dvh; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp, doc, setDoc, query, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB-dwq2yjLEUSNZ0UT5oq4-u_KXghysXfw",
            authDomain: "discord2-1ed09.firebaseapp.com",
            projectId: "discord2-1ed09",
            storageBucket: "discord2-1ed09.firebasestorage.app",
            messagingSenderId: "856172729472",
            appId: "1:856172729472:web:fa00078f5968d3e30a0265",
            measurementId: "G-XLL488F4K0"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Required App ID for Firestore paths
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'discord-clone-v2';

        window.FirebaseSDK = { 
            auth, db, appId,
            collection, addDoc, onSnapshot, serverTimestamp, 
            signInAnonymously, onAuthStateChanged, doc, setDoc, query, updateDoc
        };
        window.dispatchEvent(new Event('firebase-ready'));
    </script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const App = () => {
            const [fb, setFb] = useState(window.FirebaseSDK);
            const [user, setUser] = useState(null);
            const [profile, setProfile] = useState(null);
            
            const [currentServer, setCurrentServer] = useState('global');
            const [activeChannel, setActiveChannel] = useState('general');
            const [showCreateModal, setShowCreateModal] = useState(false);
            
            const [servers, setServers] = useState([]);
            const [messages, setMessages] = useState([]);
            const [inputText, setInputText] = useState('');
            const [newServerName, setNewServerName] = useState('');
            
            const scrollRef = useRef(null);

            useEffect(() => {
                const handleReady = () => setFb(window.FirebaseSDK);
                if (!fb) window.addEventListener('firebase-ready', handleReady);
                return () => window.removeEventListener('firebase-ready', handleReady);
            }, [fb]);

            // Rule 3: Auth BEFORE Queries
            useEffect(() => {
                if (!fb) return;
                
                const initAuth = async () => {
                    try {
                        // Check for custom token first, then fallback to anonymous
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await fb.signInWithCustomToken(fb.auth, __initial_auth_token);
                        } else {
                            await fb.signInAnonymously(fb.auth);
                        }
                    } catch (e) {
                        console.error("Auth error:", e);
                    }
                };
                initAuth();

                const unsubscribe = fb.onAuthStateChanged(fb.auth, (u) => {
                    setUser(u);
                });
                return () => unsubscribe();
            }, [fb]);

            // Profile Listener - Rule 1: Correct Private Path
            useEffect(() => {
                // GUARD: Must have user before querying
                if (!user || !fb) return;

                // Path format: /artifacts/{appId}/users/{userId}/{collectionName}/{docId}
                const profileDoc = fb.doc(fb.db, 'artifacts', fb.appId, 'users', user.uid, 'settings', 'profile');
                
                const initProfile = async () => {
                    try {
                        await fb.setDoc(profileDoc, { uid: user.uid, lastSeen: fb.serverTimestamp() }, { merge: true });
                    } catch (e) {
                        console.error("Profile set error:", e);
                    }
                };
                initProfile();

                const unsubscribe = fb.onSnapshot(profileDoc, (snap) => {
                    if (snap.exists()) setProfile(snap.data());
                }, (err) => console.error("Profile permission error:", err));
                
                return () => unsubscribe();
            }, [user, fb]);

            // Servers Listener - Rule 1: Correct Public Path
            useEffect(() => {
                if (!user || !fb) return;

                // Path format: /artifacts/{appId}/public/data/{collectionName}
                const col = fb.collection(fb.db, 'artifacts', fb.appId, 'public', 'data', 'servers');
                const unsubscribe = fb.onSnapshot(col, (snap) => {
                    setServers(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                }, (err) => console.error("Server list permission error:", err));
                
                return () => unsubscribe();
            }, [user, fb]);

            // Messages Listener - Rule 1: Correct Public Path
            useEffect(() => {
                if (!user || !fb) return;
                
                const serverId = currentServer === 'global' ? 'global' : currentServer;
                // Rule 1: All public data in /artifacts/{appId}/public/data/{collectionName}
                const colName = `msg_${serverId}_${activeChannel}`;
                const col = fb.collection(fb.db, 'artifacts', fb.appId, 'public', 'data', colName);
                
                const unsubscribe = fb.onSnapshot(col, (snap) => {
                    const msgs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    // Rule 2: Sort in JS memory (No orderBy in query)
                    setMessages(msgs.sort((a, b) => (a.timestamp?.seconds || 0) - (b.timestamp?.seconds || 0)));
                }, (err) => {
                    console.error("Messages permission error:", err);
                    setMessages([]);
                });
                
                return () => unsubscribe();
            }, [user, fb, currentServer, activeChannel]);

            useEffect(() => {
                if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
            }, [messages]);

            const handleCreateServer = async () => {
                if (!newServerName.trim() || !user || !profile?.username) return;
                try {
                    const col = fb.collection(fb.db, 'artifacts', fb.appId, 'public', 'data', 'servers');
                    await fb.addDoc(col, {
                        name: newServerName.trim(),
                        ownerId: user.uid,
                        ownerName: profile.username,
                        createdAt: fb.serverTimestamp()
                    });
                    setNewServerName('');
                    setShowCreateModal(false);
                } catch (e) { console.error("Create server error:", e); }
            };

            const sendMessage = async () => {
                if (!inputText.trim() || !user || !fb || !profile?.username) return;
                const text = inputText.trim();
                const serverId = currentServer === 'global' ? 'global' : currentServer;
                const colName = `msg_${serverId}_${activeChannel}`;
                setInputText('');
                try {
                    const col = fb.collection(fb.db, 'artifacts', fb.appId, 'public', 'data', colName);
                    await fb.addDoc(col, {
                        user: profile.username,
                        userId: user.uid,
                        content: text,
                        timestamp: fb.serverTimestamp()
                    });
                } catch (err) { console.error("Send message error:", err); }
            };

            const handleSetUsername = async (name) => {
                if (!name.trim() || !user) return;
                try {
                    const profileDoc = fb.doc(fb.db, 'artifacts', fb.appId, 'users', user.uid, 'settings', 'profile');
                    await fb.updateDoc(profileDoc, {
                        username: name.trim()
                    });
                } catch (e) { console.error("Set username error:", e); }
            };

            if (!user) return <div className="h-screen w-full bg-[#1e1f22] flex items-center justify-center font-bold text-white">Connecting...</div>;

            if (!profile?.username) return (
                <div className="h-screen w-full bg-[#1e1f22] flex items-center justify-center p-6 text-white">
                    <div className="bg-[#313338] p-8 rounded-2xl w-full max-w-sm text-center border border-white/5 shadow-2xl">
                        <div className="w-20 h-20 bg-[#5865f2] rounded-3xl flex items-center justify-center mx-auto mb-6">
                            <i data-lucide="user-plus" className="w-10 h-10 text-white"></i>
                        </div>
                        <h1 className="text-2xl font-bold mb-2">Welcome!</h1>
                        <p className="text-sm text-[#949ba4] mb-6">Choose a nickname to start chatting.</p>
                        <input 
                            className="w-full bg-[#1e1f22] p-4 rounded-xl mb-4 text-center outline-none border border-white/10 focus:border-[#5865f2] text-white" 
                            placeholder="Your Nickname" 
                            maxLength={15}
                            onKeyDown={e => {
                                if(e.key === 'Enter') handleSetUsername(e.target.value);
                            }}
                        />
                        <p className="text-[10px] text-[#949ba4]">Press Enter to join</p>
                    </div>
                </div>
            );

            return (
                <div className="flex chat-container w-full bg-[#313338] text-[#dbdee1] overflow-hidden">
                    <div className="w-[72px] bg-[#1e1f22] flex flex-col items-center py-3 space-y-3 flex-shrink-0">
                        <div 
                            onClick={() => setCurrentServer('global')}
                            className={`w-12 h-12 rounded-[16px] flex items-center justify-center transition-all cursor-pointer ${currentServer === 'global' ? 'bg-[#5865f2] text-white rounded-[12px]' : 'bg-[#313338] text-[#dbdee1] hover:bg-[#5865f2] hover:text-white hover:rounded-[12px]'}`}
                        >
                            <i data-lucide="globe" className="w-6 h-6"></i>
                        </div>
                        <div className="w-8 h-[2px] bg-white/5 rounded-full"></div>
                        {servers.map(s => (
                            <div 
                                key={s.id}
                                onClick={() => setCurrentServer(s.id)}
                                className={`w-12 h-12 rounded-[24px] flex items-center justify-center transition-all cursor-pointer font-bold uppercase text-xs text-center px-1 overflow-hidden leading-tight ${currentServer === s.id ? 'bg-[#5865f2] text-white rounded-[12px]' : 'bg-[#313338] text-[#dbdee1] hover:bg-[#5865f2] hover:text-white hover:rounded-[12px]'}`}
                            >
                                {s.name.substring(0, 3)}
                            </div>
                        ))}
                        <div 
                            onClick={() => setShowCreateModal(true)}
                            className="w-12 h-12 rounded-[24px] bg-[#313338] text-[#23a559] flex items-center justify-center hover:bg-[#23a559] hover:text-white hover:rounded-[12px] transition-all cursor-pointer"
                        >
                            <i data-lucide="plus" className="w-6 h-6"></i>
                        </div>
                    </div>

                    <div className="w-60 bg-[#2b2d31] flex flex-col flex-shrink-0 hidden lg:flex">
                        <div className="h-12 px-4 flex items-center border-b border-[#1e1f22] font-bold text-white shadow-sm truncate">
                            {currentServer === 'global' ? 'Global Space' : (servers.find(s => s.id === currentServer)?.name || 'Server')}
                        </div>
                        <div className="flex-1 p-3 space-y-4">
                            <div>
                                <div className="text-[12px] uppercase font-bold text-[#949ba4] px-2 mb-2">Channels</div>
                                <div className="flex items-center px-2 py-1.5 rounded-md bg-[#3f4147] text-white">
                                    <i data-lucide="hash" className="w-4 h-4 mr-2 opacity-50"></i>
                                    <span className="font-medium text-sm">general</span>
                                </div>
                            </div>
                        </div>
                        <div className="bg-[#232428] p-3">
                            <div className="flex items-center space-x-2">
                                <div className="w-8 h-8 bg-[#5865f2] rounded-full flex items-center justify-center font-bold text-xs uppercase text-white">{profile.username[0]}</div>
                                <div className="flex-1 min-w-0">
                                    <div className="text-white text-xs font-bold truncate">{profile.username}</div>
                                    <div className="text-[10px] text-[#949ba4] truncate">#{user.uid.slice(0, 5)}</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div className="flex-1 flex flex-col min-w-0 bg-[#313338] relative">
                        <div className="h-12 border-b border-[#1e1f22] flex items-center px-4 shadow-sm">
                            <i data-lucide="hash" className="w-5 h-5 text-[#80848e] mr-2"></i>
                            <span className="font-bold text-white text-sm">general</span>
                        </div>
                        <div ref={scrollRef} className="flex-1 overflow-y-auto p-4 space-y-4">
                            {messages.map(m => (
                                <div key={m.id} className="flex items-start space-x-3 group">
                                    <div className="w-10 h-10 bg-[#5865f2] rounded-full flex-shrink-0 flex items-center justify-center font-bold text-white uppercase text-sm">{m.user ? m.user[0] : '?'}</div>
                                    <div className="min-w-0">
                                        <div className="flex items-baseline space-x-2">
                                            <span className={`font-bold text-[15px] ${m.userId === user.uid ? 'text-indigo-300' : 'text-white'}`}>{m.user}</span>
                                            <span className="text-[10px] text-[#949ba4]">
                                                {m.timestamp?.seconds ? new Date(m.timestamp.seconds * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '...'}
                                            </span>
                                        </div>
                                        <p className="text-[15px] text-[#dbdee1] break-words leading-relaxed">{m.content}</p>
                                    </div>
                                </div>
                            ))}
                        </div>
                        <div className="px-4 pb-6 pt-2">
                            <div className="bg-[#383a40] rounded-xl px-4 py-2 flex items-center shadow-lg border border-white/5">
                                <input 
                                    className="flex-1 bg-transparent outline-none text-[15px] text-[#dbdee1] placeholder-[#949ba4] py-1" 
                                    placeholder="Message #general" 
                                    value={inputText} 
                                    onChange={e => setInputText(e.target.value)} 
                                    onKeyDown={e => e.key === 'Enter' && sendMessage()} 
                                />
                                <button onClick={sendMessage} className={`p-2 ml-2 transition-all ${inputText.trim() ? 'text-[#5865f2]' : 'text-[#b5bac1] opacity-50'}`}>
                                    <i data-lucide="send" className="w-5 h-5"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    {showCreateModal && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-[100] flex items-center justify-center p-6 text-white">
                            <div className="bg-[#313338] p-8 rounded-2xl w-full max-w-sm text-center border border-white/5 shadow-2xl">
                                <h2 className="text-2xl font-bold mb-2">Create Server</h2>
                                <input 
                                    className="w-full bg-[#1e1f22] p-4 rounded-xl mb-4 outline-none border border-white/10 focus:border-[#5865f2] text-white" 
                                    placeholder="Server Name" 
                                    value={newServerName}
                                    onChange={e => setNewServerName(e.target.value)}
                                />
                                <div className="flex space-x-3">
                                    <button onClick={() => setShowCreateModal(false)} className="flex-1 py-3 text-sm font-bold text-[#dbdee1] hover:underline">Cancel</button>
                                    <button onClick={handleCreateServer} className="flex-1 bg-[#5865f2] py-3 rounded-xl font-bold text-white shadow-lg">Create</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
        setInterval(() => window.lucide && window.lucide.createIcons(), 1000);
    </script>
</body>
</html>
